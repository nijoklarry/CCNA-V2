{id:"LAB1",t:"NA",type:"lab",q:"Task 1: All relevant ports are pre-configured as 802.1q trunks. Configure SW-1 port E0/0 to only permit VLANs 5 and 6.\nTask 2: Configure SW-1 and SW-2 ports e0/1 using VLAN 77 as the native VLAN.\nTask 3: Configure SW-2 port E0/2 to only permit VLAN 6.\nTask 4: Using LACP, create a Port Channel on SW-3 and SW-4. Combine e0/0 and e0/1 into a Port Channel while leaving the trunk configurations intact. Assign number 34. Only SW-3 must negotiate.",
 x:{cap:"Topology",txt:
`              R1 e0/0
                │
           e0/0 │
   SW-1 e0/1 ───────── e0/1 SW-2
   e0/2                     e0/2
     │                        │
   e0/2                     e0/2
   SW-3 e0/0,e0/1 ═ Po34 ═ e0/0,e0/1 SW-4`},
 sol:
`! SW-1
interface e0/0
 switchport trunk allowed vlan 5,6
interface e0/1
 switchport trunk native vlan 77
end
write

! SW-2
interface e0/1
 switchport trunk native vlan 77
interface e0/2
 switchport trunk allowed vlan 6
end
write

! SW-3  (active = initiates LACP negotiation)
interface range e0/0-1
 channel-group 34 mode active
end
write

! SW-4  (passive = only responds)
interface range e0/0-1
 channel-group 34 mode passive
end
write`,
 e:"\"Only SW-3 must negotiate\" means active on SW-3 and passive on SW-4 (passive/passive would never form). The native VLAN has to match on both ends of the SW-1/SW-2 link."},
{id:"LAB2",t:"IPC",type:"lab",q:"Configure OSPF routing for the network by completing the following tasks.\nTask 1: Configure OSPF on R2. Ensure R1 and R3 become neighbors.\n 1. Use process ID 30.\n 2. Use 10.22.22.22 as the router ID.\n 3. Under the OSPF process, advertise the following specific prefixes: 10.0.23.0/28 and 10.0.12.0/30.\nTask 2: Ensure R2 always becomes the DR.",
 x:{cap:"Topology – all Area 0",txt:
`R1 (Lo0 10.1.1.1/32)
  e0/1 ── 10.0.13.0/29 ── e0/0 R3 (Lo0 10.3.3.3/32)
  e0/0 ── 10.0.12.0/30 ── e0/0 R2 (Lo0 10.2.2.2/32)
R3 e0/1 ── 10.0.23.0/28 ── e0/1 R2`},
 sol:
`! R2
interface range e0/0-1
 ip ospf priority 255
exit
router ospf 30
 router-id 10.22.22.22
 network 10.0.12.0 0.0.0.3 area 0
 network 10.0.23.0 0.0.0.15 area 0
end
write`,
 e:"The wildcard is the inverse of the mask: /30 → 0.0.0.3 and /28 → 0.0.0.15. Priority 255 is the highest, so R2 wins every DR election (on an existing adjacency, use clear ip ospf process for it to take effect)."},
{id:"LAB3",t:"NA",type:"lab",q:"Task 1: Configure Sw1 and Sw2 with VLANs using the naming on the topology.\nTask 2: Assign VLANs to the appropriate interfaces from the topology. Ensure ports are set to voice and data as assigned on the topology.\nTask 3: Configure Sw1 and Sw2 for neighbor discovery using LLDP.",
 x:{cap:"Sw1 e0/0 ─── e0/0 Sw2",txt:
`VLAN Type   VLAN  Name            SW1        SW2
Data        77    IT_User_VLAN    E0/1-2     E0/3
Data        88    HR_User_VLAN    E0/3       E0/1
Voice       177   IT_Voice_VLAN   E0/1       E0/2
Voice       188   HR_Voice_VLAN   E0/3       E0/1`},
 sol:
`! Sw1
vlan 77
 name IT_User_VLAN
vlan 88
 name HR_User_VLAN
vlan 177
 name IT_Voice_VLAN
vlan 188
 name HR_Voice_VLAN
exit
interface range e0/1-2
 switchport mode access
 switchport access vlan 77
interface e0/1
 switchport voice vlan 177
interface e0/3
 switchport mode access
 switchport access vlan 88
 switchport voice vlan 188
interface e0/0
 lldp receive
 lldp transmit
end
write

! Sw2
vlan 77
 name IT_User_VLAN
vlan 88
 name HR_User_VLAN
vlan 177
 name IT_Voice_VLAN
vlan 188
 name HR_Voice_VLAN
exit
interface e0/1
 switchport mode access
 switchport access vlan 88
 switchport voice vlan 188
interface e0/2
 switchport mode access
 switchport voice vlan 177
interface e0/3
 switchport mode access
 switchport access vlan 77
interface e0/0

end
write`,
 e:"The data VLAN is set with switchport access vlan and the voice VLAN with switchport voice vlan, and both can sit on the same access port. If LLDP isn't running globally you also need lldp run."},
{id:"LAB4",t:"IPC",type:"lab",q:"Configure addressing between the two routers by completing the following tasks.\nTask 1: Configure R1 with the first usable host IP address in the 10.12.18.24/29 network. Configure R2 with the last usable host IP address in the 10.12.18.24/29 network.\nTask 2: Configure R1 with the first usable host IP address in the 2001:db8:12::C/126 network. Configure R2 with the last usable host IP address in the 2001:db8:12::C/126 network.",
 x:{cap:"Topology",txt:`R1 e0/2 ──────── e0/2 R2`},
 sol:
`! R1
interface Ethernet0/2
 ip address 10.12.18.25 255.255.255.248
 ipv6 address 2001:db8:12::D/126
 no shutdown
end
write

! R2
interface Ethernet0/2
 ip address 10.12.18.30 255.255.255.248
 ipv6 address 2001:db8:12::F/126
 no shutdown
end
write`,
 e:"The /29 10.12.18.24 runs .24–.31, so the usable range is .25–.30. The /126 2001:db8:12::C covers ::C–::F. The dump skips ::C (the subnet-router anycast address) and uses ::D and ::F."},
{id:"LAB5",t:"IPC",type:"lab",q:"Configure addressing between the two routers by completing the following tasks.\nTask 1: Configure R1 with the first usable host IP address in the IPv4 network. Configure R2 with the last usable host IP address in the IPv4 network.\nTask 2: Configure R1 with the first usable host IP address in the IPv6 network. Configure R2 with the last usable host IP address in the IPv6 network.",
 x:{cap:"R1 e0/0 ──── e0/0 R2",txt:
`IP     Subnet
IPv4   10.10.24.0/28
IPv6   2001:db8:18::/125`},
 sol:
`! R1
interface e0/0
 ip address 10.10.24.1 255.255.255.240
 ipv6 enable
 ipv6 address 2001:db8:18::1/125
end
write

! R2
interface e0/0
 ip address 10.10.24.14 255.255.255.240
 ipv6 enable
 ipv6 address 2001:db8:18::7/125
end
write`,
 e:"The /28 runs .0–.15, so the usable range is .1–.14. The /125 has 8 addresses (::0–::7), so it's ::1 and ::7. Add no shutdown if the interfaces are down."},
{id:"LAB6",t:"NA",type:"lab",q:"Task 1: Configure SW-1 with VLAN 15 and label it exactly as OPS. Configure SW-2 with VLAN 66 and label it exactly as ENGINEERING.\nTask 2: Configure the switch port connecting to PC1. Configure the switch port connecting to PC2.\nTask 3: Configure SW-1 and SW-2 for neighbor discovery using LLDP.",
 x:{cap:"Topology",txt:
`Device  VLAN  IP Address
R1      15    172.16.15.1
R2      66    192.168.66.1

R1 e0/0 ── e0/2 SW-1 e0/0 ──── e0/0 SW-2 e0/2 ── e0/0 R2
             SW-1 e0/1 ── PC1 (VLAN 15, 172.16.15.10)
             SW-2 e0/1 ── PC2 (VLAN 66, 192.168.66.50)`},
 sol:
`! SW-1
lldp run
vlan 15
 name OPS
interface e0/1
 switchport mode access
 switchport access vlan 15
interface e0/2
 no cdp enable
 lldp transmit
 lldp receive
interface e0/0
 switchport trunk encapsulation dot1q
 switchport mode trunk
end
write

! SW-2
lldp run
vlan 66
 name ENGINEERING
interface e0/1
 switchport mode access
 switchport access vlan 66
interface e0/2
 no cdp enable
 lldp transmit
 lldp receive
interface e0/0
 switchport trunk encapsulation dot1q
 switchport mode trunk
end
write`,
 e:"lldp run enables LLDP globally. This is the dump's solution: it also trunks the inter-switch link and swaps CDP for LLDP on the router-facing ports."}
],

{id:"LAB7",t:"NA",type:"lab",q:"Task 1: Configure 802.1q trunks between Sw1 and Sw2 on ports E0/0 and E0/1. Only permit VLANs 10 and 30 across the trunks.\nTask 2: Using LACP, create a Port Channel between Sw1 and Sw2. Combine E0/0 and E0/1 into a Port Channel while leaving the trunk configurations intact. Assign number 10. Both links must negotiate.",
 x:{cap:"Topology",txt:
`PC1 (VLAN 10) ── e0/2 Sw1 e0/0,e0/1 ═ Po10 ═ e0/0,e0/1 Sw2 e0/2 ── PC2 (VLAN 10)
PC3 (VLAN 30) ── e0/3 Sw1                     Sw2 e0/3 ── PC4 (VLAN 30)

PC1 10.2.2.10  PC2 10.2.2.20  PC3 10.3.3.10  PC4 10.3.3.20`},
 sol:
`! Sw1 and Sw2 (identical)
interface range e0/0-1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,30

end

 e:"\"Both links must negotiate\" means LACP active on both sides. Configure the trunk on the physical ports before bundling so the port-channel inherits it."},
{id:"LAB8",t:"NA",type:"lab",q:"Task 1: Configure 802.1q trunks between SW-1 and SW-2 on ports e0/0 and e0/1. Only permit VLANs 1, 12, and 22 across the trunk.\nTask 2: Configure SW-1 port e0/2 as an 802.1q trunk port. Only permit VLANs 12 and 22.\nTask 3: Using LACP, create a Port Channel between SW-1 and SW-2. Combine e0/0 and e0/1 into a Port Channel while leaving the trunk configurations intact. Assign number 12. Both links must negotiate.",
 x:{cap:"Topology",txt:
`SW-1 e0/0,e0/1 ═ Po12 ═ e0/0,e0/1 SW-2
SW-1 e0/2 ── e0/2 SW-3        SW-2 e0/2 ── e0/2 SW-4
SW-3 e0/1 ──────────── e0/1 SW-4`},

 switchport trunk allowed vlan 1,12,22

interface range Ethernet0/2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 12,22
end
write

! SW-2
interface range Ethernet0/0-1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 1,12,22
 channel-group 12 mode active
end
write`,
 e:"Active/active LACP on both switches. The allowed list on SW-1 e0/2 is separate (12,22 only)."},
{id:"LAB9",t:"NA",type:"lab",q:"Task 1: Configure SW-1 with VLAN 35 and label it exactly as SALES. Configure SW-2 with VLAN 39 and label it exactly as MARKETING.\nTask 2: Configure the switch port connecting to PC1. Configure the switch port connecting to PC2.\nTask 3: Configure SW-1 and SW-2 for neighbor discovery using LLDP. Disable LLDP in both directions on the interface connecting to PC1.",

/* ---------- state ---------- */
const LS = "ccna-drill-v1";
const store = (() => { try { const s = JSON.parse(localStorage.getItem(LS)); return s && typeof s==="object" ? s : {}; } catch(e){ return {}; } })();
const save = () => { try { localStorage.setItem(LS, JSON.stringify(store)); } catch(e){} };
store.hist ||= {};      // per-question history {c: times correct, w: times wrong, last: 'ok'|'bad'}
store.flags ||= {};
store.prefs ||= {shuffleQ:false, shuffleO:false, topic:"all", set:"all", examSize:"all"};
store.prefs.kind ||= "all";

const kind = q => q.type || "mc";
const KIND = {mc:"Multiple choice", dd:"Drag & drop", lab:"Lab"};
Q.forEach((q,i) => { q.id ||= "Q"+(i+1); });

let mode = "study";
let S = null;  // session

function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
const keys = n => [...Array(n).keys()];

function poolFor(prefs){
  const k = (mode==="exam" && prefs.kind==="lab") ? "all" : prefs.kind;
  return Q.map((_,i)=>i).filter(i=>{
    if(mode==="exam" && kind(Q[i])==="lab") return false;   // labs are self-graded study cards
    if(k && k!=="all" && kind(Q[i])!==k) return false;
    if(prefs.topic!=="all" && Q[i].t!==prefs.topic) return false;
    const h = store.hist[i];
    if(prefs.set==="missed") return h && h.last==="bad";
    if(prefs.set==="new") return !h;
    if(prefs.set==="flagged") return !!store.flags[i];
    return true;
  });
}

function newSession(){
  const p = store.prefs;
  let ids = poolFor(p);
  if(mode==="exam"){
    ids = shuffle(ids);
    if(p.examSize!=="all") ids = ids.slice(0, +p.examSize);
  } else if(p.shuffleQ) ids = shuffle(ids);
  const perm = {};
  ids.forEach(i => {
    const q = Q[i], k = kind(q);
    if(k==="mc") perm[i] = p.shuffleO ? shuffle(keys(q.o.length)) : keys(q.o.length);
    else if(k==="dd") perm[i] = shuffle(keys(q.pool.length));   // always shuffled: pool order would give answers away
    else perm[i] = [];
  });
  S = {ids, pos:0, sel:{}, checked:{}, shown:{}, perm, finished:false, review:false, start:Date.now()};
  render();
}

/* ---------- rendering ---------- */
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const L = "ABCDEFGH";

/* drag-and-drop: slots sharing a group label are scored as an unordered set */
function ddEval(q, sel){
  const left = {};
  q.slots.forEach(s => (left[s.g] ||= []).push(s.a));
  return q.slots.map((s,k) => {
    const v = sel[k];
    if(v==null || v<0) return false;
    const arr = left[s.g], j = arr.indexOf(q.pool[v]);
    if(j<0) return false;
    arr.splice(j,1); return true;
  });
}
function answered(i){
  const q = Q[i], sel = S.sel[i] || [];
  return kind(q)==="dd" ? sel.some(v => v!=null && v>=0) : sel.length>0;
}
function isCorrect(i){
  const q = Q[i], k = kind(q), sel = S.sel[i] || [];
  if(k==="lab") return sel[0]==="ok";
  if(k==="dd") return ddEval(q, sel).every(Boolean);
  return sel.slice().sort().join(",") === q.a.slice().sort().join(",");
}
function revealed(i){
  if(kind(Q[i])==="lab") return !!(S.shown[i] || S.checked[i]);
  return mode==="study" ? !!S.checked[i] : S.finished;
}

function render(){
  $("#m-study").setAttribute("aria-pressed", mode==="study");
  $("#m-exam").setAttribute("aria-pressed", mode==="exam");
  renderFilters(); renderGrid(); renderScore();
  if(mode==="exam" && S.finished && !S.review) return renderResults();
  if(!S.ids.length) {
    $("#main").innerHTML = `<div class="card empty"><p>No questions match this filter.</p><button class="btn" id="resetf">Show all questions</button></div>`;
    $("#resetf").onclick = () => { store.prefs.topic="all"; store.prefs.set="all"; save(); newSession(); };
    return;
  }
  renderQuestion();
}

function ddHTML(i, q, rev){
  const sel = S.sel[i] || [], res = rev ? ddEval(q, sel) : null, perm = S.perm[i];
  const used = new Set(sel.filter(v => v!=null && v>=0));
  const groups = [];
  q.slots.forEach((s,k) => { const g = groups[groups.length-1]; if(g && g.g===s.g) g.ks.push(k); else groups.push({g:s.g, ks:[k]}); });
  const ordered = groups.every(G => /^(\d+|first|second|third|fourth|fifth)$/i.test(G.g));
  const one = (k, label) => {
    const v = sel[k] ?? -1;
    const opts = `<option value="-1">${rev ? "(left empty)" : "Choose…"}</option>` + perm.map(pi =>
      `<option value="${pi}" ${pi===v?"selected":""} ${used.has(pi)&&pi!==v?"disabled":""}>${esc(q.pool[pi])}</option>`).join("");
    const st = rev ? (res[k] ? " right" : " wrong") : (v>=0 ? " filled" : "");
    const mk = rev ? `<span class="ddmark">${res[k] ? "✓" : "✗"}</span>` : "";
    return `<div class="ddrow${st}">${mk}<select class="ddsel" data-k="${k}" ${rev?"disabled":""} aria-label="${esc(label)}">${opts}</select></div>`;
  };
  const html = groups.map(G => {
    const bad = rev && G.ks.some(k => !res[k]);
    const fix = bad ? `<div class="ddfix"><b>Answer:</b> ${G.ks.map(k => esc(q.slots[k].a)).join(" · ")}</div>` : "";
    const cls = G.ks.length>1 ? "ddgroup" : ("ddgroup single" + (ordered ? " step" : ""));
    return `<div class="${cls}"><div class="ddhead">${esc(G.g)}</div><div class="ddbody">${G.ks.map((k,n) => one(k, G.g + (G.ks.length>1 ? " item "+(n+1) : ""))).join("")}${fix}</div></div>`;
  }).join("");
  let unused = "";
  if(rev){
    const left = q.pool.slice();
    q.slots.forEach(s => { const j = left.indexOf(s.a); if(j>=0) left.splice(j,1); });
    if(left.length) unused = `<p class="ddunused"><b>Not used:</b> ${left.map(esc).join(" · ")}</p>`;
  }
  return `<div class="dd">${html}</div>${unused}`;
}

function renderQuestion(){
  const i = S.ids[S.pos], q = Q[i], k = kind(q), rev = revealed(i);
  const multi = k==="mc" && q.a.length>1;
  const sel = S.sel[i] || [];
  let body = "", verdict = "";

  if(k==="mc"){
    const perm = S.perm[i];
    const opts = perm.map((orig, n) => {
      let cls = "opt" + (multi?" multi":"");
      let mark = "";
      const picked = sel.includes(orig), right = q.a.includes(orig);
      if(rev){
        if(right && picked){ cls+=" right"; mark="✓ correct"; }
        else if(picked){ cls+=" wrong"; mark="✗ your pick"; }
        else if(right){ cls+=" missed"; mark="✓ answer"; }
      } else if(picked) cls+=" sel";
      return `<li><button class="${cls}" data-o="${orig}" ${rev?"disabled":""} aria-pressed="${picked}">
        <span class="key">${L[n]}</span><span class="txt">${esc(q.o[orig])}</span><span class="mark">${mark}</span></button></li>`;
    }).join("");
    body = `<ul class="opts">${opts}</ul>`;
    if(rev){
      const ok = isCorrect(i);
      const letters = perm.map((o,n)=>q.a.includes(o)?L[n]:null).filter(Boolean).join(", ");
      verdict = `<div class="verdict ${ok?"ok":"bad"}"><h3>${ok?"Correct":(sel.length?"Not quite":"Not answered")} · Answer: ${letters}</h3><p>${esc(q.e)}</p>${q.n?`<p class="note"><b>Answer-key note.</b> ${esc(q.n)}</p>`:""}</div>`;
    }
  } else if(k==="dd"){
    body = ddHTML(i, q, rev);
    if(rev){
      const res = ddEval(q, sel), good = res.filter(Boolean).length, ok = good===res.length;
      verdict = `<div class="verdict ${ok?"ok":"bad"}"><h3>${ok?"Correct":(answered(i)?"Not quite":"Not answered")} · ${good} of ${res.length} placed correctly</h3><p>${esc(q.e)}</p>${q.n?`<p class="note"><b>Answer-key note.</b> ${esc(q.n)}</p>`:""}</div>`;
    }
  } else { // lab
    if(rev){
      const graded = S.checked[i];
      const grade = graded
        ? `<p class="graded">${sel[0]==="ok" ? "✓ Marked as got it" : "✗ Marked to redo"} · <button class="linkbtn" id="regrade">change</button></p>`
        : `<div class="selfgrade"><span>Compare with your config. How did you do?</span><button class="btn ok" id="gok">I had it right</button><button class="btn" id="gbad">I missed something</button></div>`;
      body = `<figure class="exhibit sol"><div class="lbl"><span>Solution</span><span>dump answer A</span></div><pre>${esc(q.sol)}</pre></figure>
        <div class="verdict"><h3>Why</h3><p>${esc(q.e)}</p>${q.n?`<p class="note"><b>Answer-key note.</b> ${esc(q.n)}</p>`:""}</div>${grade}`;
    } else {
      body = `<div class="labhint">Work it out on paper or in Packet Tracer first, then reveal the dump's solution and mark yourself.</div>`;
    }
  }

  const last = S.pos === S.ids.length-1;
  let primary;
  if(k==="lab"){
    primary = rev
      ? `<button class="btn primary" id="next" ${last?"disabled":""}>Next question</button>`
      : `<button class="btn primary" id="showsol">Show solution</button>`;
  } else if(mode==="study"){
    primary = rev
      ? `<button class="btn primary" id="next" ${last?"disabled":""}>Next question</button>`
      : `<button class="btn primary" id="check" ${answered(i)? "":"disabled"}>Check answer</button>`;
  } else if(S.finished){
    primary = `<button class="btn primary" id="toResults">Back to results</button>`;
  } else {
    primary = last
      ? `<button class="btn primary" id="finish">Finish exam</button>`
      : `<button class="btn primary" id="next">Next</button>`;
  }

  const hint = k==="mc" ? `A–E select · Enter ${mode==="study"?"check":"next"} · ←/→ move`
             : k==="dd" ? `Pick an item for each slot · ←/→ move` : `Enter ${rev?"next":"reveal"} · ←/→ move`;
  const exLabel = k==="lab" ? "Topology" : "Exhibit";

  $("#main").innerHTML = `
    <div class="qhead">
      <span class="qnum">Question ${S.pos+1} <span>of ${S.ids.length}</span></span>
      <span class="tag">${TOPICS[q.t]}</span>
      ${k!=="mc"?`<span class="tag kind">${KIND[k]}</span>`:""}
      ${multi?`<span class="tag multi">Choose ${q.a.length}</span>`:""}
      <span class="qid">${q.id}</span>
      <span class="spacer"></span>
      <button class="flagbtn" id="flag" aria-pressed="${!!store.flags[i]}">${store.flags[i]?"⚑ Flagged":"⚐ Flag"}</button>
    </div>
    <article class="card">
      ${q.x?`<figure class="exhibit"><div class="lbl"><span>${exLabel}</span><span>${q.x.cap===exLabel?"":esc(q.x.cap)}</span></div><pre>${esc(q.x.txt)}</pre></figure>`:""}
      <p class="prompt${k==="lab"?" tasks":""}">${esc(q.q).replace(/\n/g,"<br>")}${multi?` <span class="choose">(Choose ${q.a.length === 2 ? "two" : q.a.length})</span>`:""}</p>
      ${body}
      ${verdict}
      <div class="actions">
        <button class="btn" id="prev" ${S.pos===0?"disabled":""}>Previous</button>
        ${primary}
        <span class="grow"></span>
        <span class="hint">${hint}</span>
      </div>
    </article>`;

  document.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.o));
  document.querySelectorAll(".ddsel").forEach(s => s.onchange = () => place(+s.dataset.k, +s.value));
  $("#prev").onclick = () => go(-1);
  $("#next") && ($("#next").onclick = () => go(1));
  $("#check") && ($("#check").onclick = check);
  $("#showsol") && ($("#showsol").onclick = showSolution);
  $("#gok") && ($("#gok").onclick = () => grade("ok"));
  $("#gbad") && ($("#gbad").onclick = () => grade("bad"));
  $("#regrade") && ($("#regrade").onclick = () => { delete S.checked[i]; render(); });
  $("#finish") && ($("#finish").onclick = finishPrompt);
  $("#toResults") && ($("#toResults").onclick = () => { S.review=false; render(); });
  $("#flag").onclick = () => { store.flags[i] ? delete store.flags[i] : store.flags[i]=1; save(); render(); };
}

function place(k, v){
  const i = S.ids[S.pos]; if(revealed(i)) return;
  const sel = (S.sel[i] || Array(Q[i].slots.length).fill(-1)).slice();
  sel[k] = v; S.sel[i] = sel; render();
  const el = document.querySelector(`.ddsel[data-k="${k}"]`); el && el.focus();
}
function showSolution(){ const i = S.ids[S.pos]; S.shown[i] = true; render(); }
function grade(r){ const i = S.ids[S.pos]; S.sel[i] = [r]; S.checked[i] = true; record(i); save(); render(); }

function pick(orig){
  const i = S.ids[S.pos]; if(revealed(i)) return;
  const q = Q[i]; let sel = S.sel[i] || [];
  if(q.a.length>1){
    sel = sel.includes(orig) ? sel.filter(x=>x!==orig) : (sel.length < q.a.length ? [...sel, orig] : [...sel.slice(1), orig]);
  } else sel = [orig];
  S.sel[i] = sel; render();
}
function record(i){
  const h = store.hist[i] || {c:0,w:0};
  if(isCorrect(i)){ h.c++; h.last="ok"; } else { h.w++; h.last="bad"; }
  store.hist[i] = h;
}
function check(){
  const i = S.ids[S.pos]; if(kind(Q[i])==='lab' || !answered(i) || S.checked[i]) return;
  S.checked[i] = true; record(i); save(); render();
}
function go(d){ const n = S.pos + d; if(n<0 || n>=S.ids.length) return; S.pos = n; render(); window.scrollTo({top:0, behavior:"smooth"}); }

let confirming = false;
function finishPrompt(){
  const unanswered = S.ids.filter(i => !answered(i)).length;
  if(unanswered && !confirming){
    confirming = true;
    const a = $(".actions");
    const div = document.createElement("div");
    div.className = "confirm";
    div.innerHTML = `<span>${unanswered} unanswered. Finish anyway?</span><button class="btn primary" id="yes">Finish</button><button class="btn" id="no">Keep going</button>`;
    a.after(div);
    $("#yes").onclick = () => { confirming=false; finish(); };
    $("#no").onclick = () => { confirming=false; div.remove(); };
    return;
  }
  finish();
}
function finish(){
  S.finished = true; S.end = Date.now();
  S.ids.forEach(record); save(); render();
}

function renderResults(){
  const n = S.ids.length, ok = S.ids.filter(isCorrect).length, pct = Math.round(ok/n*100);
  const secs = Math.round((S.end - S.start)/1000), mm = Math.floor(secs/60), ss = String(secs%60).padStart(2,"0");
  const by = {};
  S.ids.forEach(i => { const t=Q[i].t; by[t] ||= {n:0,ok:0}; by[t].n++; if(isCorrect(i)) by[t].ok++; });
  const rows = Object.keys(TOPICS).filter(t=>by[t]).map(t => {
    const r = by[t], p = Math.round(r.ok/r.n*100);
    return `<tr><td>${TOPICS[t]}</td><td><div class="mini"><i style="width:${p}%"></i></div></td><td class="n">${r.ok}/${r.n}</td></tr>`;
  }).join("");
  const firstWrong = S.ids.findIndex(i=>!isCorrect(i));
  $("#main").innerHTML = `<article class="card results">
    <h2>Exam complete</h2>
    <div class="pct" style="color:${pct>=82?"var(--ok)":"var(--bad)"}">${pct}%</div>
    <div class="pass">${ok} of ${n} correct · ${mm}:${ss} elapsed · ${pct>=82?"above":"below"} the ~82% (825/1000) pass mark</div>
    <table class="topics"><thead><tr><th>Exam domain</th><th></th><th class="n">Score</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="actions">
      <button class="btn primary" id="rev" ${firstWrong<0?"disabled":""}>Review mistakes</button>
      <button class="btn" id="revall">Review all</button>
      <button class="btn" id="again">New exam</button>
    </div></article>`;
  $("#rev").onclick = () => { S.review=true; S.pos=firstWrong; render(); };
  $("#revall").onclick = () => { S.review=true; S.pos=0; render(); };
  $("#again").onclick = newSession;
}

function renderGrid(){
  const g = $("#grid");
  g.innerHTML = S.ids.map((i,k) => {
    let c = "cell";
    if(revealed(i)) c += isCorrect(i) ? " ok" : (answered(i) || (S.finished && kind(Q[i])!=="lab") ? " bad" : "");
    else if(answered(i)) c += " ans";
    if(k===S.pos && !(mode==="exam" && S.finished && !S.review)) c += " cur";
    if(store.flags[i]) c += " flag";
    return `<button class="${c}" data-k="${k}" aria-label="Question ${k+1}">${k+1}</button>`;
  }).join("");
  g.querySelectorAll(".cell").forEach(b => b.onclick = () => { if(mode==="exam"&&S.finished) S.review=true; S.pos=+b.dataset.k; render(); });
}

function renderScore(){
  const p = $("#p-score");
  if(mode==="study"){
    const done = S.ids.filter(i=>S.checked[i]), ok = done.filter(isCorrect).length, bad = done.length-ok;
    const pct = done.length ? Math.round(ok/done.length*100) : 0;
    const all = Object.keys(store.hist).length;
    const missed = Object.values(store.hist).filter(h=>h.last==="bad").length;
    p.innerHTML = `<h2>This session</h2>
      <div class="score"><span class="big">${done.length?pct+"%":"–"}</span><span class="sub">${ok} right · ${bad} wrong · ${S.ids.length-done.length} left</span></div>
      <div class="bar"><i class="b-ok" style="width:${ok/S.ids.length*100}%"></i><i class="b-bad" style="width:${bad/S.ids.length*100}%"></i></div>
      <div class="legend"><span style="--c:var(--muted)">All time: ${all}/${Q.length} seen, ${missed} to redo</span></div>`;
  } else {
    const nAns = S.ids.filter(answered).length;
    p.innerHTML = `<h2>Exam</h2>
      <div class="score"><span class="big">${nAns}<span class="sub">/${S.ids.length}</span></span><span class="sub">${S.finished?"finished":"answered · no feedback until you finish"}</span></div>
      <div class="bar"><i class="b-ok" style="width:${nAns/S.ids.length*100}%;background:var(--accent)"></i></div>
      ${S.finished?"":`<div class="actions" style="margin-top:12px"><button class="btn" id="finish2">Finish exam</button></div>`}`;
    $("#finish2") && ($("#finish2").onclick = () => { S.pos = S.ids.length-1; render(); finishPrompt(); });
  }
}

function renderFilters(){
  const p = store.prefs;
  const topicOpts = `<option value="all">All domains</option>` + Object.entries(TOPICS).map(([k,v]) => {
    const n = Q.filter(q=>q.t===k).length; return `<option value="${k}" ${p.topic===k?"selected":""}>${v} (${n})</option>`; }).join("");
  const cnt = s => poolFor({...p, set:s}).length;
  const kinds = mode==="exam" ? ["all","mc","dd"] : ["all","mc","dd","lab"];
  const kSel = (mode==="exam" && p.kind==="lab") ? "all" : p.kind;
  const kindOpts = kinds.map(v => {
    const n = v==="all" ? Q.filter(q => mode!=="exam" || kind(q)!=="lab").length : Q.filter(q=>kind(q)===v).length;
    return `<option value="${v}" ${kSel===v?"selected":""}>${v==="all"?(mode==="exam"?"All scored types":"All types"):KIND[v]+(v==="lab"?" (study cards)":"")} (${n})</option>`; }).join("");
  $("#p-filters").innerHTML = `<h2>${mode==="study"?"Study set":"Exam setup"}</h2>
    <label>Type<select id="f-kind">${kindOpts}</select></label>
    <label>Domain<select id="f-topic">${topicOpts}</select></label>
    <label>Questions<select id="f-set">
      <option value="all" ${p.set==="all"?"selected":""}>All (${cnt("all")})</option>
      <option value="missed" ${p.set==="missed"?"selected":""}>Last answered wrong (${cnt("missed")})</option>
      <option value="new" ${p.set==="new"?"selected":""}>Never answered (${cnt("new")})</option>
      <option value="flagged" ${p.set==="flagged"?"selected":""}>Flagged (${cnt("flagged")})</option>
    </select></label>
    ${mode==="exam"?`<label>Exam length<select id="f-size">
      ${["10","20","40","all"].map(v=>`<option value="${v}" ${p.examSize===v?"selected":""}>${v==="all"?"Every matching question":v+" questions"}</option>`).join("")}
    </select></label>`:`<label class="check"><input type="checkbox" id="f-sq" ${p.shuffleQ?"checked":""}> Shuffle question order</label>`}
    <label class="check"><input type="checkbox" id="f-so" ${p.shuffleO?"checked":""}> Shuffle answer options</label>
    <div class="row"><button class="btn" id="restart">${mode==="exam"?"Start new exam":"Restart session"}</button></div>
    <div class="row" id="resetrow"><button class="linkbtn" id="wipe">Clear all progress</button></div>`;
  const upd = (k,v) => { p[k]=v; save(); newSession(); };
  $("#f-kind").onchange = e => upd("kind", e.target.value);
  $("#f-topic").onchange = e => upd("topic", e.target.value);
  $("#f-set").onchange = e => upd("set", e.target.value);
  $("#f-size") && ($("#f-size").onchange = e => upd("examSize", e.target.value));
  $("#f-sq") && ($("#f-sq").onchange = e => upd("shuffleQ", e.target.checked));
  $("#f-so").onchange = e => upd("shuffleO", e.target.checked);
  $("#restart").onclick = newSession;
  $("#wipe").onclick = () => {
    $("#resetrow").innerHTML = `<span class="confirm">Erase history and flags? <button class="linkbtn" id="wy">Erase</button> <button class="linkbtn" id="wn">Cancel</button></span>`;
    $("#wy").onclick = () => { store.hist={}; store.flags={}; save(); newSession(); };
    $("#wn").onclick = renderFilters;
  };
}

$("#m-study").onclick = () => { if(mode!=="study"){ mode="study"; newSession(); } };
$("#m-exam").onclick = () => { if(mode!=="exam"){ mode="exam"; newSession(); } };

document.addEventListener("keydown", e => {
  if(e.target.closest("select,input") || e.metaKey || e.ctrlKey || e.altKey) return;
  if(!S || !S.ids.length || (mode==="exam" && S.finished && !S.review)) return;
  const k = e.key.toUpperCase();
  const i = S.ids[S.pos];
  const idx = "ABCDE".indexOf(k) >= 0 ? "ABCDE".indexOf(k) : "12345".indexOf(k);
  if(kind(Q[i])==="mc" && idx >= 0 && idx < Q[i].o.length && k.length===1){ pick(S.perm[i][idx]); return; }
  if(e.key==="ArrowRight") go(1);
  else if(e.key==="ArrowLeft") go(-1);
  else if(e.key==="Enter"){
    if(e.target.tagName==="BUTTON") return;
    if(kind(Q[i])==="lab"){ revealed(i) ? go(1) : showSolution(); }
    else if(mode==="study"){ revealed(i) ? go(1) : check(); }
    else if(!S.finished){ S.pos===S.ids.length-1 ? finishPrompt() : go(1); }
  }
});

$("#qcount").textContent = Q.length;
newSession();
</script>

</body>
</html>
