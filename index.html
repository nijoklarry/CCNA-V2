<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCNA 200-301 Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: study-desk tool. Main question pane + right rail (progress map, filters). Console-cable blue accent, terminal-style exhibits. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --sunken:#e8ecf0; --line:#d3dae1;
  --fg:#16202a; --muted:#5a6876; --accent:#0a6e9a; --accent-ink:#ffffff; --accent-soft:#dcedf5;
  --ok:#1d7a46; --ok-soft:#dff3e7; --bad:#b4321f; --bad-soft:#fae3de; --warn:#9a6a00;
  --term-bg:#0f1b24; --term-fg:#d6e4ee; --term-dim:#7d93a3;
  --f-display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d151c; --surface:#15212b; --sunken:#1b2935; --line:#2a3b49;
  --fg:#e3ebf1; --muted:#93a5b4; --accent:#4cb3e0; --accent-ink:#06202d; --accent-soft:#163445;
  --ok:#56c98a; --ok-soft:#14321f; --bad:#f07a66; --bad-soft:#3a1c17; --warn:#e3b33f;
  --term-bg:#081016; --term-fg:#d6e4ee; --term-dim:#6f8697; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d151c; --surface:#15212b; --sunken:#1b2935; --line:#2a3b49;
  --fg:#e3ebf1; --muted:#93a5b4; --accent:#4cb3e0; --accent-ink:#06202d; --accent-soft:#163445;
  --ok:#56c98a; --ok-soft:#14321f; --bad:#f07a66; --bad-soft:#3a1c17; --warn:#e3b33f;
  --term-bg:#081016; --term-fg:#d6e4ee; --term-dim:#6f8697; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:22px 18px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .code{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,4vw,32px);line-height:1.1;margin:0;letter-spacing:-.01em}
.modes{display:flex;gap:4px;background:var(--sunken);padding:4px;border-radius:999px}
.modes button{border:0;background:transparent;padding:7px 16px;border-radius:999px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
@media (max-width:880px){.layout{grid-template-columns:minmax(0,1fr)}}

/* Question pane */
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:14px}
.qnum{font-family:var(--f-display);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.qnum span{color:var(--muted);font-weight:500}
.tag{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.multi{background:var(--sunken);color:var(--muted)}
.qhead .spacer{flex:1}
.flagbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.flagbtn[aria-pressed="true"]{border-color:var(--warn);color:var(--warn)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,3vw,28px)}
.exhibit{margin:0 0 20px}
.exhibit .lbl{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.exhibit pre{margin:0;background:var(--term-bg);color:var(--term-fg);font-family:var(--f-mono);font-size:13px;line-height:1.55;padding:14px 16px;border-radius:8px;overflow-x:auto;white-space:pre}
.exhibit pre .dim{color:var(--term-dim)}
.prompt{font-size:18px;line-height:1.55;margin:0 0 18px;text-wrap:pretty}
.choose{display:inline-block;font-size:13px;color:var(--muted);margin-left:4px}

.opts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:start;width:100%;text-align:left;padding:11px 14px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer;transition:border-color .12s, background .12s}
.opt:hover{border-color:var(--accent)}
.opt .key{display:grid;place-items:center;width:28px;height:28px;border-radius:7px;border:1.5px solid var(--line);font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--muted)}
.opt.multi .key{border-radius:6px}
.opt:not(.multi) .key{border-radius:50%}
.opt .txt{padding-top:3px;white-space:pre-line;min-width:0}
.opt .mark{font-family:var(--f-mono);font-size:12px;padding-top:6px;white-space:nowrap}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .key{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .key{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.right .mark{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.wrong .mark{color:var(--bad)}
.opt.missed{border-style:dashed;border-color:var(--ok)}
.opt.missed .mark{color:var(--ok)}

.verdict{margin-top:18px;border-radius:9px;padding:14px 16px;border:1px solid var(--line);background:var(--sunken)}
.verdict h3{margin:0 0 4px;font-family:var(--f-display);font-size:16px}
.verdict.ok h3{color:var(--ok)} .verdict.bad h3{color:var(--bad)}
.verdict p{margin:0;color:var(--fg);max-width:68ch}
.verdict .note{margin-top:10px;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.verdict .note b{color:var(--warn)}

.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 18px;font-family:var(--f-display);font-weight:600;font-size:14px;cursor:pointer}
.btn:hover:not([disabled]){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.actions .grow{flex:1}
.hint{font-size:12.5px;color:var(--muted);font-family:var(--f-mono)}
@media (max-width:560px){.hint{display:none}}

/* Rail */
.rail{display:flex;flex-direction:column;gap:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
@media (max-width:880px){.rail{position:static}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h2{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:700}
.score{display:flex;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums}
.score .big{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1}
.score .sub{color:var(--muted);font-size:14px}
.bar{height:8px;border-radius:999px;background:var(--sunken);overflow:hidden;display:flex;margin-top:12px}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)} .bar .b-bad{background:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0;background:var(--c)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}
.cell{aspect-ratio:1;max-width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-family:var(--f-mono);font-size:11.5px;cursor:pointer;display:grid;place-items:center;font-variant-numeric:tabular-nums;position:relative;color:var(--muted)}
.cell.ans{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cell.cur{outline:2px solid var(--fg);outline-offset:1px;color:var(--fg);font-weight:600}
.cell.flag::after{content:"";position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:var(--warn)}

.filters{display:flex;flex-direction:column;gap:10px}
.filters label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
select{font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--fg);width:100%}
.check{flex-direction:row!important;align-items:center;gap:8px!important;color:var(--fg)!important;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:13px;text-decoration:underline;text-underline-offset:2px}
.confirm{font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Results */
.results h2{font-family:var(--f-display);font-size:26px;margin:0 0 4px}
.results .pct{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.results .pass{font-family:var(--f-mono);font-size:13px;margin-top:6px}
.topics{width:100%;border-collapse:collapse;margin-top:22px;font-variant-numeric:tabular-nums}
.topics th,.topics td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:14px}
.topics th{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:400}
.topics td.n{text-align:right;white-space:nowrap}
.mini{height:6px;border-radius:999px;background:var(--sunken);overflow:hidden;min-width:60px}
.mini i{display:block;height:100%;background:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:40px 10px}

/* Item id + type */
.qid{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tag.kind{background:var(--fg);color:var(--bg)}

/* Drag & drop as slot pickers */
.dd{display:flex;flex-direction:column;gap:12px}
.ddgroup{border:1.5px solid var(--line);border-radius:9px;padding:12px 14px;background:var(--surface)}
.ddhead{font-family:var(--f-display);font-weight:700;font-size:14px;margin-bottom:8px}
.ddbody{display:flex;flex-direction:column;gap:8px;min-width:0}
.ddgroup.single{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:8px 16px;align-items:center}
.ddgroup.single .ddhead{font-family:var(--f-body);font-weight:400;font-size:15px;margin:0}
.ddgroup.single.step{grid-template-columns:44px minmax(0,1fr)}
.ddgroup.single.step .ddhead{font-family:var(--f-mono);font-weight:600;color:var(--accent);text-transform:capitalize}
@media (max-width:620px){.ddgroup.single:not(.step){grid-template-columns:minmax(0,1fr)}}
.ddrow{display:flex;align-items:center;gap:8px;min-width:0}
.ddrow select{flex:1;min-width:0;white-space:normal;text-overflow:ellipsis}
.ddrow.filled select{border-color:var(--accent);background:var(--accent-soft)}
.ddrow.right select{border-color:var(--ok);background:var(--ok-soft);opacity:1}
.ddrow.wrong select{border-color:var(--bad);background:var(--bad-soft);opacity:1}
.ddmark{font-family:var(--f-mono);font-size:13px;width:14px;flex:none}
.ddrow.right .ddmark{color:var(--ok)} .ddrow.wrong .ddmark{color:var(--bad)}
.ddfix{font-size:14px;color:var(--ok);margin-top:2px}
.ddfix b{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.ddunused{font-size:14px;color:var(--muted);margin:12px 0 0}
.ddunused b{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
select:disabled{color:var(--fg)}

/* Labs as study cards */
.prompt.tasks{font-size:16px}
.labhint{font-size:14px;color:var(--muted);border:1.5px dashed var(--line);border-radius:9px;padding:12px 14px}
.exhibit.sol{margin-top:4px}
.exhibit.sol pre{border-left:3px solid var(--ok)}
.selfgrade{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:16px;font-size:14px;color:var(--muted)}
.selfgrade span{flex-basis:100%}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.graded{margin:14px 0 0;font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="code">Cisco 200-301 · <span id="qcount">100</span> items</span>
      <h1>CCNA 200-301 Drill</h1>
    </div>
    <div class="modes" role="group" aria-label="Mode">
      <button id="m-study" aria-pressed="true">Study</button>
      <button id="m-exam" aria-pressed="false">Exam</button>
    </div>
  </header>

  <div class="layout">
    <main id="main"></main>
    <aside class="rail">
      <section class="panel" id="p-score"></section>
      <section class="panel">
        <h2>Question map</h2>
        <div class="grid" id="grid"></div>
        <div class="legend">
          <span style="--c:var(--ok)">Correct</span>
          <span style="--c:var(--bad)">Wrong</span>
          <span style="--c:var(--accent)">Answered</span>
          <span style="--c:var(--warn)">Flagged</span>
        </div>
      </section>
      <section class="panel filters" id="p-filters"></section>
    </aside>
  </div>
</div>

<script>
const TOPICS = {
  NF:"Network Fundamentals", NA:"Network Access", IPC:"IP Connectivity",
  IPS:"IP Services", SEC:"Security Fundamentals", AUTO:"Automation & Programmability"
};

/* a = indexes of correct options (0 = A) */
const Q = [
{t:"IPS",q:"Which per-hop traffic-control feature does an ISP implement to mitigate the potential negative effect of a customer exceeding its committed bandwidth?",
 o:["Marking","Policing","Queuing","Shaping"],a:[1],
 e:"Policing enforces the contracted rate at the provider edge by dropping or re-marking traffic above the CIR. Shaping is the customer-side counterpart: it buffers excess traffic instead of dropping it."},
{t:"SEC",q:"What are two examples of multifactor authentication?",
 o:["single sign-on","shared password repository","passwords that expire","unique user knowledge","soft tokens"],a:[3,4],
 e:"MFA combines different factor types: something you know (unique user knowledge such as a PIN) and something you have (a soft token on a phone). SSO and expiring passwords are still a single factor."},
{t:"NF",q:"What are two functions of a firewall within an enterprise?",
 o:["It serves as an endpoint for a site-to-site VPN in standalone mode.","It enables wireless devices to connect to the network.","It provides support as an endpoint for a remote access VPN in multiple context mode.","It enables traffic filtering based on URLs.","It offers Layer 2 services between hosts."],a:[0,3],
 e:"Firewalls (ASA/NGFW) terminate site-to-site VPNs in single-context (standalone) mode and next-gen firewalls filter by URL category. Wireless access is the AP/WLC's job and L2 services belong to switches."},
{t:"NF",q:"In which way does a spine-and-leaf architecture allow for scalability in a network when additional access ports are required?",
 o:["A leaf switch is added with connections to every spine switch.","A leaf switch is added with a single connection to a core spine switch.","A spine switch is added with at least 40 GB uplinks.","A spine switch and a leaf switch are added with redundant connections between them."],a:[0],
 e:"Endpoints connect to leaves, and every leaf connects to every spine. Need more access ports? Add a leaf and uplink it to all spines, so every path stays the same number of hops."},
{t:"NF",q:"What is the role of nonoverlapping channels in a wireless environment?",
 o:["to reduce interference","to increase bandwidth","to stabilize the RF environment","to allow for channel bonding"],a:[0],
 e:"Adjacent APs placed on nonoverlapping channels (1, 6, 11 in 2.4 GHz) don't interfere with each other, which reduces co-channel and adjacent-channel interference."},
{t:"AUTO",q:"In what way does a network supervisor reduce maintenance costs while maintaining network integrity on a traditionally managed network?",
 o:["They employ additional network administrators to proactively manage the network.","They use automation to centralize network-management tasks.","They install an automated network-monitoring system to provide early warning of network issues.","They automate change-management processes that verify issue resolution."],a:[1],
 e:"Centralizing management tasks through automation removes repetitive per-device work, which lowers operating cost and keeps configurations consistent."},
{t:"AUTO",q:"What are two benefits of controller-based networking compared to traditional networking?",
 o:["controller-based increases network bandwidth usage, while traditional lightens the load on the network","controller-based inflates software costs, while traditional decreases individual licensing costs","controller-based provides centralization of key IT functions, while traditional requires distributed management functions","controller-based reduces network configuration complexity, while traditional increases the potential for errors","controller-based allows for fewer network failures, while traditional increases failure rates"],a:[2,3],
 e:"A controller centralizes management and policy, and it pushes consistent configuration so there is less box-by-box CLI work and fewer human errors."},
{t:"SEC",q:"What is the definition of backdoor malware?",
 o:["malicious code that infects a user machine and then uses that machine to send spam","malicious code that is installed onto a computer to allow access by an unauthorized user","malicious program that is used to launch other malicious programs","malicious code with the main purpose of downloading other malicious code"],a:[1],
 e:"A backdoor bypasses normal authentication so an attacker can get back in later. A spam-sending host is a bot, and a program that fetches more malware is a downloader or dropper."},
{t:"AUTO",q:"How is AI used to identify issues within network traffic?",
 o:["It analyzes patterns for anomaly detection.","It exclusively predicts device malfunctions.","It enhances data packet delivery speeds.","It simplifies traffic route mapping."],a:[0],
 e:"AI/ML learns a baseline of normal traffic and flags deviations from it. That's anomaly detection. Watch for absolute words like \"exclusively\" in distractors."},
{t:"SEC",q:"Refer to the exhibit. Users will be using a preconfigured secret key and SSID and must have a secured key hashing algorithm configured. The AAA server must not be used for the user authentication method. Which action completes the task?",
 x:{cap:"WLC 9800 · WLAN › Security › Layer2 (transcribed)",txt:
`Security Type ............ Personal
MAC Filtering ............ [ ]
AutoConfig iPSK .......... [ ] Enable

WPA2+WPA3 Parameters
  Policy ................. [x] WPA2   [ ] WPA3
  Encryption Cipher ...... [ ] CCMP128(AES)

Fast Transition
  Fast Transition ........ Disable

Protected Management Frame
  PMF .................... Disabled

Authentication Key Management
  PSK Format ............. ASCII
  PSK .................... ••••••••
  PSK .................... [ ] Enable
  PSK-SHA2 ............... [ ] Enable`},
 o:["Enable AutoConfig iPSK.","Set CCMP128(AES).","Configure PSK Format HEX with key string.","Configure PSK-SHA2."],a:[3],
 e:"Pre-shared key with no AAA means PSK. The \"secured key hashing algorithm\" requirement is met by PSK-SHA2, which derives keys with SHA-256 instead of SHA-1."},
{t:"IPC",q:"Refer to the exhibit. PC Y is communicating with another device at IP address 10.227.150.193. Which router does router Y use to route traffic?",
 x:{cap:"Topology + routing table",txt:
`PC Y 10.224.6.3 ── G0/1 10.224.6.1 [Router Y] G0/0 10.224.1.1 ──┬── Router A 10.224.1.2
                                                               ├── Router B 10.224.1.3
                                                               ├── Router C 10.224.1.4
                                                               └── Router D 10.224.1.5

Router-Y#show ip route
Gateway of last resort is not set

      10.0.0.0/8 is variably subnetted
S        10.0.0.0/8 [1/0] via 10.224.1.2
S        10.128.0.0/9 [1/0] via 10.224.1.3
O        10.224.0.0/11 [110/0] via 10.224.1.5, 5d18h
O        10.224.0.0/15 [110/0] via 10.224.1.4, 5d18h
C        10.224.6.0/24 is directly connected, GigabitEthernet0/1
C        10.224.1.0/24 is directly connected, GigabitEthernet0/0
O        10.226.0.0/15 [110/0] via 10.224.1.5, 5d18h
O        10.227.150.160/27 [110/0] via 10.224.1.3, 1w6d`},
 o:["router D","router A","router C","router B"],a:[0],
 e:"Longest match wins. 10.227.150.193 is outside 10.227.150.160/27 (.160–.191). The next most specific match is 10.226.0.0/15 (10.226.0.0–10.227.255.255) via 10.224.1.5, which is router D."},
{t:"SEC",q:"Refer to the exhibit. Which functionalities will this SSID have while being used by wireless clients?",
 x:{cap:"WLC 9800 · Add WLAN › Security › Layer2 (transcribed)",txt:
`( ) WPA + WPA2   (•) WPA2 + WPA3   ( ) WPA3   ( ) Static WEP   ( ) None
MAC Filtering [ ]        Lobby Admin Access [ ]

WPA Parameters                         Fast Transition
  WPA Policy  [ ]   WPA2 Policy [ ]      Status ............ Enabled
  GTK Rand.   [ ]   WPA3 Policy [x]      Over the DS ....... [ ]
  Transition Disable [ ]                 Reassociation Timeout 20

WPA2/WPA3 Encryption                   Auth Key Mgmt
  AES(CCMP128) [x]  CCMP256 [ ]          SAE [ ]      FT + SAE    [x]
  GCMP128      [ ]  GCMP256 [ ]          OWE [ ]      FT + 802.1x [ ]
                                         802.1x-SHA256 [ ]
Protected Management Frame               Anti Clogging Threshold 1500
  PMF ......... Required                 Max Retries ........... 5`},
 o:["decreases network security against offline dictionary attacks and encourages easy access to the network","decreases network security against air sniffing attacks and discourages the use of complex passwords","increases network security against man in the middle attacks and discourages denial of service attacks","increases network security against offline dictionary attacks and discourages time-consuming brute force attacks"],a:[3],
 e:"WPA3 with SAE (here FT+SAE) replaces the PSK 4-way handshake with a Dragonfly exchange. Captured handshakes can't be cracked offline, and every guess needs a live exchange, so brute force becomes slow."},
{t:"NF",q:"What is a characteristic of a Layer 2 switch?",
 o:["uses the data link layer for communications","tracks the number of active TCP connections","provides a single broadcast domain for all connected devices","filters based on a transport layer protocol"],a:[0],
 e:"A Layer 2 switch forwards frames by MAC address, which is the data link layer. With VLANs it creates multiple broadcast domains, and it doesn't look at TCP or UDP."},
{t:"SEC",q:"Which type of VPN connection is used when an employee accesses a secure server from a public Wi-Fi?",
 o:["router-to-router","site-to-site","open","remote"],a:[3],
 e:"A single user connecting from anywhere (e.g. AnyConnect over public Wi-Fi) uses a remote-access VPN. Site-to-site links whole networks through gateways."},
{t:"IPC",q:"What is the primary purpose of the first hop redundancy protocols?",
 o:["to ensure high availability of the network by providing a transparent fail-over at the active gateway","to ensure high availability of the network by providing a backup route on the CEF in case of a gateway failure","to ensure high availability of the network by providing a redundant path via ARP in case of a failure of path failure","to ensure high availability of the network by providing a secondary route on the RIB at the active gateway"],a:[0],
 e:"HSRP, VRRP and GLBP share a virtual IP/MAC as the hosts' default gateway. If the active router fails, a standby takes over without any change on the hosts."},
{t:"NA",q:"How does MAC learning function?",
 o:["sends frames with unknown destinations to a multicast group","enabled by default on all VLANs and interfaces","increases security on the management VLAN","inspects and drops frames from unknown destinations"],a:[1],
 e:"Switches learn source MACs automatically on every VLAN and interface by default. Unknown-unicast destinations are flooded within the VLAN, not sent to a multicast group or dropped."},
{t:"SEC",q:"When a WPA2-PSK WLAN is configured in the Wireless LAN Controller, what is the minimum number of characters that is required in ASCII format?",
 o:["6","12","8","18"],a:[2],
 e:"A WPA2 passphrase is 8–63 ASCII characters, or exactly 64 hex characters."},
{t:"AUTO",q:"What are two characteristics of a controller-based network?",
 o:["It moves the control plane to a central point.","The administrator can make configuration updates from the CLI.","It decentralizes the control plane, which allows each device to make its own forwarding decisions.","It uses northbound and southbound APIs to communicate between architectural layers.","It uses Telnet to report system issues."],a:[0,3],
 e:"SDN centralizes the control plane in a controller. Northbound APIs (REST) talk to apps and southbound APIs (NETCONF, OpenFlow) talk to devices."},
{t:"SEC",q:"What are two recommendations for protecting network ports from being exploited when located in an office space outside of an IT closet?",
 o:["configure ports to a fixed speed","configure static ARP entries","enable the PortFast feature on ports","implement port-based authentication","shut down unused ports"],a:[3,4],
 e:"For ports in exposed areas, use 802.1X port-based authentication so only authorized devices get on, and shut down unused ports so nobody can plug in. PortFast only speeds up STP convergence."},
{t:"NF",q:"Which cloud provided service allows an organization to install its own operating system on a virtual machine?",
 o:["platform-as-a-service","infrastructure-as-a-service","software-as-a-service","network-as-a-service"],a:[1],
 e:"IaaS gives you the VM itself and you install and manage the OS. With PaaS the provider supplies the OS and runtime, and SaaS is the finished application."},
{t:"NA",q:"What is a service that is provided by a wireless controller?",
 o:["It provides Layer 3 routing between wired and wireless devices.","It manages interference in a dense network.","It issues IP addresses to wired devices.","It mitigates threats from the internet."],a:[1],
 e:"A WLC runs RRM (Radio Resource Management). It adjusts AP channels and transmit power automatically to manage interference, which matters most in dense deployments."},
{t:"AUTO",q:"How does automation affect network management processes?",
 o:["It performs configuration updates based on user profiles.","It interoperates with ISE to define and manage patch and update schedules.","It provides a reactive support model.","It improves the efficiency of system lifecycle management."],a:[3],
 e:"Automation makes provisioning, changes and upgrades consistent and repeatable across the device lifecycle, which improves efficiency. It is proactive, not reactive."},
{t:"AUTO",q:"What are two advantages of implementing a controller-based architecture instead of a traditional network architecture?",
 o:["It allows for seamless connectivity to virtual machines.","It provides increased scalability and management options.","It supports complex and high-scale IP addressing schemes.","It increases security against denial-of-service attacks.","It enables configuration task automation."],a:[1,4],
 e:"The usual advantages of a controller-based architecture are centralized management that scales and automated configuration tasks."},
{t:"SEC",q:"Which IPsec mode provides encapsulation and encryption of the entire original IP packet on a site-to-site VPN?",
 o:["IPsec transport mode with AH","IPsec tunnel mode with ESP","IPsec tunnel mode with AH","IPsec transport mode with ESP"],a:[1],
 e:"Tunnel mode wraps the whole original packet in a new IP header, which is the site-to-site default. Only ESP encrypts, because AH authenticates without encrypting."},
{t:"SEC",q:"Refer to the exhibit. An engineer is creating a secure preshared key based SSID using WPA2 for a wireless network running on 2.4 GHz and 5 GHz. Which two tasks must the engineer perform to complete the process?",

{t:"IPC",q:"Which Cisco proprietary protocol ensures traffic recovers automatically when the active gateway fails?",
 o:["HSRP","FHRP","VRRP","SLB"],a:[0],
 e:"HSRP (and GLBP) are Cisco proprietary. VRRP is the open standard (RFC 5798), and FHRP is the generic name for the protocol family."},

{t:"SEC",q:"Which security program element helps protect against employees unintentionally leaking sensitive information via email?",
 o:["physical access controls","controlled internet access","workstation screen recordings","user awareness campaigns"],a:[3],
 e:"Unintentional leaks are a human-behavior problem, and security awareness training is the program element that addresses them."},

{t:"SEC",q:"What is a characteristic of encryption in wireless networks?",
 o:["uses a unidirectional handshake for authentication","intercepts data threats before they attack a network","uses integrity checks to identify forgery attacks","prevents intercepted data from being easily read"],a:[3],
 e:"Encryption provides confidentiality. Someone can sniff the frames but can't read them. Integrity checks (MIC) are a separate function."},
{t:"NA",q:"How does MAC learning function?",
 o:["restricts ports to a maximum of 10 dynamically-learned addresses","associates the MAC address with the port on which it is received","increases security on the management VLAN","drops received MAC addresses not listed in the address table"],a:[1],
 e:"The switch records each frame's source MAC against its ingress port (and VLAN) in the CAM table. MAC limits are port security, a separate feature."},
{t:"AUTO",q:"Which role does AI play in monitoring network data flow?",
 o:["It simplifies traffic route mapping.","It analyzes patterns for anomaly detection.","It enhances data packet delivery speeds.","It exclusively predicts device malfunctions."],a:[1],
 e:"Same idea as the other AI questions: AI baselines traffic patterns and flags anomalies."},
{t:"AUTO",q:"How does network automation help reduce network downtime?",
 o:["By using automation platforms with intent-based configuration, all changes are checked for possible outages before being implemented.","Changes can be implemented in parallel across multiple devices at once, which increases the speed of the change rate.","Configuration templates and testing can be built into implementation, which increases the success rate of a network change.","Emails can be generated based on when a network admin performs a network change, which increases visibility."],a:[2],
 e:"Templates plus built-in validation mean fewer human errors, so more changes succeed and less downtime is self-inflicted. Pushing faster or in parallel doesn't by itself reduce outages."},
{t:"NA",q:"Which AP mode wirelessly connects two separate network segments each set up within a different campus building?",
 o:["bridge","mesh","local","point-to-point"],a:[0],
 e:"Bridge mode APs form wireless links between buildings (point-to-point or point-to-multipoint bridging). \"Point-to-point\" is a topology, not an AP mode."},
{t:"SEC",q:"Which security element uses a combination of one-time passwords, a login name, and a personal smartphone?",
 o:["rule-based access control","software-defined segmentation","multifactor authentication","attribute-based access control"],a:[2],
 e:"Here the login name and password are something you know, and the smartphone generating OTPs is something you have. Combining factor types is MFA."},

{t:"NF",q:"Which cable type must be used when connecting a router and switch together using these:\n1. Pins 1 and 2 are receivers and pins 3 and 6 are transmitters\n2. Auto detection MDI-X is unavailable.",
 o:["crossover","console","straight-through","rollover"],a:[2],

{t:"AUTO",q:"Which protocol does Ansible use to push modules to nodes in a network?",
 o:["Telnet","Kerberos","SSH","SNMP"],a:[2],
 e:"Ansible is agentless and push-based. It connects over SSH (and NETCONF/HTTPS API for some network modules). Puppet and Chef use agents."},
{t:"AUTO",q:"Which function generally performed by a traditional network device is replaced by a software-defined controller?",
 o:["encryption and decryption for VPN link processing","encapsulation and decapsulation of packets in a data-link frame","changing the source or destination address during NAT operations","building route tables and updating the forwarding table"],a:[3],
 e:"Building route tables and updating the forwarding table is control-plane work, and that's what the SDN controller takes over. Encapsulation, NAT and encryption are data-plane work and stay on the device."},

{t:"NF",q:"What are two behaviors of a point-to-point WAN topology?",
 o:["It leverages a dedicated connection.","It uses a single router to route traffic between sites.","It connects remote networks through a single line.","It delivers redundancy between the central office and branch offices.","It provides direct connections between each router in the topology."],a:[0,2],

{t:"AUTO",q:"What is the main difference between traditional networks and controller-based networking?",
 o:["Controller-based networks provide a framework for innovation, and traditional networks create efficiency.","Controller-based networks increase TCO for the company, and traditional networks require less investment.","Controller-based networks are open for application requests, and traditional networks operate manually.","Controller-based networks are a closed ecosystem, and traditional networks take advantage of programmability."],a:[2],
 e:"Controllers expose northbound APIs that applications can call. Traditional networks are configured by hand, box by box."},
{t:"AUTO",q:"Which technology is appropriate for communication between an SDN controller and applications running over the network?",
 o:["NETCONF","REST API","OpenFlow","Southbound API"],a:[1],
 e:"Apps talk to the controller through the northbound interface, which is normally a REST API. NETCONF and OpenFlow are southbound (controller to devices)."},
{t:"SEC",q:"How does encryption protect the wireless network?",
 o:["via a policy to prevent unauthorized users from communicating on the wireless network","via integrity checks to identify wireless forgery attacks in the frame","via specific ciphers to detect and prevent zero-day network attacks","via an algorithm to change wireless data so that only the access point and client understand it"],a:[3],
 e:"Encryption transforms the data with a cipher and key so only the client and AP, which hold the keys, can read it."},
{t:"IPS",q:"What is the purpose of the logging facility?",
 o:["It defines the severity of the syslog event.","It represents the source that generated the syslog event.","It represents the timestamp of the syslog event.","It contains the text message that describes the syslog event."],a:[1],
 e:"In %FACILITY-SEVERITY-MNEMONIC: description, the facility identifies the source (e.g. LINEPROTO, OSPF, SYS) and the severity is a level from 0 to 7."},
{t:"NA",q:"Which type of wired port is required when an AP offers one unique SSID, passes client data and management traffic, and is in autonomous mode?",
 o:["LAG","access","trunk","default"],a:[2],
 e:"An autonomous AP carries a management VLAN and the SSID's client VLAN, which are separate VLANs. Two VLANs on one switchport means an 802.1Q trunk."},

{t:"AUTO",q:"How does AI contribute to network traffic analysis?",
 o:["It simplifies traffic route mapping.","It eliminates network threats","It enhances data packet delivery speeds.","It analyzes patterns for anomaly detection."],a:[3],
 e:"AI analyzes patterns to detect anomalies. It doesn't \"eliminate\" threats, so be wary of absolute claims."},
{t:"AUTO",q:"Which benefit does automation provide in network management?",
 o:["It reduces the complexity of network management systems.","It decreases CPU and memory load on networking devices.","It increases the performance of networking devices.","It reduces network failures due to human error."],a:[3],
 e:"The main win from automation is consistency. Fewer manual CLI changes means fewer outages caused by typos and misconfigurations."},
{t:"AUTO",q:"How do predictive AI models enhance network resource allocation?",
 o:["They anticipate future traffic spikes.","They select correct cabling types for deployment.","They solely monitor historical traffic volumes.","They assign IP addresses to devices."],a:[0],
 e:"Predictive models use historical trends to forecast demand, such as traffic spikes, so capacity can be allocated in advance. \"Solely monitor\" describes plain monitoring, not prediction."},
{t:"NF",q:"What is the difference between the TCP and UDP protocols?",
 o:["TCP has an inherent order for packet assembly, and UDP reassembles packets in a specific order.","TCP has a 20-byte minimal header size, and UDP has an 8-byte header size.","TCP uses only a checksum, and UDP has an acknowledgment mechanism.","TCP requires five packets to set up a connection, and UDP requires only three packets."],a:[1],
 e:"The TCP header is at least 20 bytes and the UDP header is a fixed 8. UDP has no ordering, ACKs or handshake, and TCP's handshake is 3 packets."},
{t:"IPS",q:"What is the purpose of classifying network traffic in QoS?",
 o:["configures traffic-matching rules on network devices","writes the class identifier of a packet to a dedicated field in the packet header","services traffic according to its class","identifies the type of traffic that will receive a particular treatment"],a:[3],
 e:"Classification identifies what the traffic is so the right QoS treatment can be applied. Writing a value into the header (DSCP/CoS) is marking, and servicing traffic by class is queuing/scheduling."},
{t:"AUTO",q:"Which advantage does machine learning offer for network security?",
 o:["It manages firewall rule sets.","It improves real-time threat detection.","It controls VPN access permissions.","It enforces password complexity requirements."],a:[1],
 e:"ML spots unusual behavior as it happens, which improves real-time threat detection. The other options are ordinary policy-enforcement tasks."},
{t:"NA",q:"Which AP mode provides a wireless connection between two network segments?",
 o:["root","FlexConnect","local","bridge"],a:[3],
 e:"Bridge mode links separate wired segments over wireless. FlexConnect is for branch APs that switch traffic locally, and local is the default mode tunneled to the WLC."},
{t:"IPC",q:"What is the primary purpose of a First Hop Redundancy Protocol?",
 o:["It allows a router to use bridge priorities to create multiple loop-free paths to a single destination.","It allows directly connected neighbors to share configuration information.","It reduces routing failures by allowing Layer 3 load balancing between OSPF neighbors that have the same link metric.","It reduces routing failures by allowing more than one router to represent itself as the default gateway of a network."],a:[3],
 e:"With an FHRP, several routers share one virtual default-gateway IP, so hosts keep forwarding if one router fails. Bridge priorities belong to STP."},
{t:"AUTO",q:"Which two features are provided by Ansible in network automation?",
 o:["launching job templates using version control","manual playbook runs","supplying network credentials","role-based access control","agentless deployment"],a:[1,4],
 e:"Ansible (the CLI engine) is agentless and runs playbooks on demand. Job templates, credential management and RBAC are Ansible Tower/AWX features."},

{t:"SEC",q:"What is a characteristic of encryption in wireless networks?",
 o:["eliminates network piggybacking","encodes plain text into cipher text","uses ciphers to authenticate","identifies an access point on a WLAN"],a:[1],
 e:"Encryption turns plaintext into ciphertext. Authentication is a separate step, and the SSID/BSSID identifies an AP."},
{t:"IPS",q:"Which action prevents debug messages from being sent via syslog while allowing other messages when an abnormally high number of syslog messages are generated by a device with the debug process turned on?",
 o:["Turn off the logging monitor in global configuration mode.","Set the logging trap severity level to informational.","Use an access list to filter out the syslog messages.","Disable logging to the console."],a:[1],
 e:"logging trap informational sends levels 0–6 to the syslog server and drops level 7 (debugging). Logging monitor and console only affect terminal and console output, not syslog."},

{t:"AUTO",q:"How does automation leverage data models to reduce the operational complexity of a managed network?",
 o:["reduces the response time for specific requests to devices with many interfaces","categorizes traffic and provides insights","allows the controller to be vendor-agnostic","streamlines monitoring using SNMP and other polling tools"],a:[2],
 e:"Standard data models (YANG) describe configuration and state the same way on every device, so a controller can manage gear from different vendors without vendor-specific CLI."},
{t:"IPC",q:"Why would a network administrator implement the HSRP protocol?",
 o:["to provide network redundancy in the case of a router failure","to allow hosts in a network to use the same default gateway virtual IP when load-balancing traffic","to use an open standard protocol that is configured on Cisco and third-party routers","to allow clients to be configured with multiple default gateway IPs"],a:[0],
 e:"HSRP gives gateway redundancy: a standby router takes over the virtual IP if the active one fails. HSRP doesn't load-balance (that's GLBP), and it's Cisco proprietary, not an open standard (that's VRRP)."},

{t:"AUTO",q:"What is an advantage of using SDN versus traditional networking when it comes to security?",
 o:["SDN creates a unified control point making security policies consistent across all devices, and traditional networking must be configured device by device, leaving room for error.","SDN exposes an API to configure locally per device for security policies, and traditional networking uses northbound API for network admin interface for configuring security policies.","SDN security is managed near the perimeter of the network with firewalls, VPNs, and IPS, and traditional networking security policies are created based on telemetry data.","SDN devices communicate with each other to establish a security policy, and in traditional networking, devices communicate upstream to a central location to establish a security policy."],a:[0],
 e:"The controller is a single point of policy, so security rules are pushed consistently to every device. In a traditional network each box is configured separately, which invites mistakes."},
{t:"AUTO",q:"Which role does machine learning play in identifying network security breaches?",
 o:["It monitors for outdated software.","It identifies patterns indicating intrusions.","It dictates security policy updates.","It assigns security clearance levels."],a:[1],
 e:"ML learns what normal looks like and recognizes patterns that indicate an intrusion. Same theme as the other AI/ML questions."},
{t:"NA",q:"Which feature when used on a WLC allows it to bundle its distribution system ports into one 802.3ad group?",
 o:["LAG","ISL","QinQ","PAgP"],a:[0],
 e:"Link Aggregation (LAG) bundles the WLC's distribution system ports into one 802.3ad EtherChannel. A WLC doesn't negotiate with PAgP or LACP, so the switch side must be \"channel-group mode on\"."},
{t:"NF",q:"What is the difference between the TCP and UDP protocols?",
 o:["TCP manages multicast and broadcast data transfers, and UDP only handles unicast communications.","TCP is used for transmitting data over the internet, and UDP is used for transmitting data over a local network.","TCP is used to ensure data integrity in a file transfer, and UDP is used to broadcast a message to multiple recipients.","TCP ensures ordered, reliable data delivery, and UDP offers low latency and high throughput."],a:[3],
 e:"TCP delivers data reliably and in order (sequencing, ACKs, retransmission). UDP skips all that, so it has lower latency and overhead, which suits voice, video and DNS."},
{t:"NF",q:"What is a function of Layer 3 switches?",
 o:["They move frames between endpoints limited to IP addresses.","They route traffic between devices in different VLANs.","They transmit broadcast traffic when operating in Layer 3 mode exclusively.","They forward Ethernet frames between VLANs using only MAC addresses."],a:[1],
 e:"A multilayer switch routes between VLANs using SVIs (interface vlan X), so you don't need a router-on-a-stick. MAC addresses alone can't move traffic between VLANs."},
{t:"NF",q:"What is a benefit of a point-to-point leased line?",
 o:["full-mesh capability","simplicity of configuration","low cost","flexibility of design"],a:[1],
 e:"A leased line is a dedicated private link between two sites with very little to configure. Its downsides are high cost and inflexibility."},
{t:"IPC",q:"Why implement VRRP?",
 o:["to hand over to end users the autodiscovery of virtual gateways","to detect link failures without the overhead of Bidirectional Forwarding Detection","to provide end users with a virtual gateway in a multivendor network","to leverage a weighting scheme to provide uninterrupted service"],a:[2],
 e:"VRRP is the open-standard FHRP (RFC 5798), so it works across vendors and gives hosts one virtual default gateway. Weighting schemes are a GLBP feature."},

{t:"SEC",q:"Refer to the exhibit. An engineer is using the Cisco WLC GUI to configure a WLAN for WPA2 encryption with AES and preshared key Cisc0123456. After the engineer selects the WPA+WPA2 option from the Layer 2 Security drop-down list, which two tasks must they perform to complete the process?",

{t:"IPC",q:"Refer to the exhibit. The loopback IP of R3 has been learned via the two interfaces on R1. R1 is configured with a reference bandwidth of 10 Gbps. Based on the metric calculations, which next hop IP would be used for outgoing routing?",

{t:"NF",q:"What is a characteristic of a Layer 2 switch?",
 o:["responsible for sending data in a particular sequence","filters based on a transport layer protocol","maintains stateful transaction information","makes forwarding decisions based on MAC addresses"],a:[3],
 e:"A Layer 2 switch forwards by destination MAC using its MAC address table. Sequencing and stateful tracking belong to TCP and firewalls."},
{t:"NF",q:"What is a characteristic of an SSID in wireless networks?",
 o:["prevents network sniffing tools from obtaining data","requires the use of PoE for functionality","allows easy file sharing between endpoints","may contain letters, numbers, and special characters"],a:[3],
 e:"An SSID is just the network name, up to 32 characters, and can include letters, numbers and special characters. It provides no security on its own."},

{t:"SEC",q:"Which authentication method requires the user to provide a physical attribute to authenticate successfully?",

{t:"IPC",q:"Why would VRRP be implemented when configuring a new subnet in a multivendor environment?",

{t:"SEC",q:"Why does an administrator choose to implement a remote access IPsec VPN?",

{t:"NF",q:"What differentiates the TCP and UDP protocols?",
 o:["TCP establishes a connection with the device on the other end before transferring, and UDP transfers without establishing a connection.","TCP tracks segments being transmitted or received by assigning segment numbers, and UDP adjusts data flow according to network conditions.","TCP immediately transmits data without waiting for a handshake, and UDP awaits a response from the receiver before sending additional data.","TCP sends data at a constant rate with error checking on upper protocol layers, and UDP provides error-checking and sequencing."],a:[0],
 e:"TCP is connection-oriented (three-way handshake first) and UDP is connectionless. The distractors swap TCP and UDP features."},
{t:"AUTO",q:"What is a function of a northbound API in an SDN environment?",
 o:["It relies on global provisioning and configuration.","It supports distributed processing for configuration.","It provides orchestration and network automation services.","It upgrades software and restores files."],a:[2],
 e:"Northbound APIs (usually REST) let applications and orchestration tools ask the controller to automate the network. Southbound APIs push changes down to devices."},
{t:"IPS",q:"Which two transport layer protocols carry syslog messages?",
 o:["TCP","ARP","IP","RTP","UDP"],a:[0,4],
 e:"Syslog uses UDP 514 by default, and TCP (e.g. 601, or 6514 with TLS) for reliable delivery. ARP and IP aren't transport layer, and RTP is for media."},
{t:"NF",q:"What is a characteristic of cloud-based network topology?",
 o:["physical workstations are configured to share resources","onsite network services are provided with physical Layer 2 and Layer 3 components","services are provided by a public, private, or hybrid deployment","wireless connections provide the sole access method to services"],a:[2],
 e:"Cloud services are delivered through public, private or hybrid (and community) deployment models. On-site physical L2/L3 gear describes a traditional on-premises network."},
{t:"AUTO",q:"What is the role of disaggregation in controller-based networking?",
 o:["It divides the control-plane and data-plane functions.","It summarizes the routes between the core and distribution layers of the network topology.","It streamlines traffic handling by assigning individual devices to perform either Layer 2 or Layer 3 functions.","It enables a network topology to quickly adjust from a ring network to a star network."],a:[0],
 e:"Disaggregation splits the control plane (in the controller) from the data plane (on the devices). That separation is the core idea of SDN."},
{t:"SEC",q:"Which two tasks support the physical access control element of a security program?",

 e:"Physical access control means badge readers and video surveillance. The other three options (workshops, slideshows, information) are user awareness and training."},

 o:["access-list 100 deny tcp host 172.16.1.33 any eq 23\naccess-list 100 permit ip any any\ninterface GigabitEthernet0/0\n ip access-group 100 in",
    "access-list 100 deny tcp host 172.16.1.33 any eq 22\naccess-list 100 permit ip any any\nline vty 0 15\n access-class 100 in",
    "access-list 100 deny tcp host 172.16.1.33 any eq 23\naccess-list 100 permit ip any any\nline vty 0 15\n access-class 100 in",
    "access-list 100 deny tcp host 172.16.1.33 any eq 22\naccess-list 100 permit ip any any\ninterface GigabitEthernet0/0\n ip access-group 100 in"],a:[1],
 e:"SSH is TCP 22, and applying the ACL to the VTY lines covers SSH to any of the router's addresses, loopbacks included. Applying it to G0/0 would also filter SSH that passes through the router to other hosts."},
{id:"Q123",t:"IPS",q:"A network administrator must enable DHCP services between two sites. What must be configured for the router to pass DHCPDISCOVER messages on to the server?",
 o:["DHCP Binding","DHCP Snooping","a DHCP Relay Agent","a DHCP Pool"],a:[2],
 e:"DHCPDISCOVER is a broadcast, and routers don't forward broadcasts. ip helper-address makes the router a relay agent that unicasts the request to the server."},

{id:"Q125",t:"SEC",q:"A network engineer is replacing the switches that belong to a managed-services client with new Cisco Catalyst switches. The new switches will be configured for updated security standards, including replacing Telnet services with encrypted connections and doubling the modulus size from 1024. Which two commands must the engineer configure on the new switches?",
 o:["transport input all","crypto key generate rsa usage-keys","transport input ssh","crypto key generate rsa modulus 2048","crypto key generate rsa general-keys modulus 1024"],a:[2,3],
 e:"transport input ssh allows only SSH on the VTY lines, and modulus 2048 doubles the 1024-bit key size."},
{id:"Q126",t:"SEC",q:"After a recent security breach and a RADIUS failure, an engineer must secure the console port of each enterprise router with a local username and password. Which configuration must the engineer apply to accomplish this task?",
 o:["aaa new-model\nline con 0\npassword plaintextpassword\nprivilege level 15","aaa new-model\naaa authorization exec default local\naaa authentication login default radius\nusername localuser privilege 15 secret plaintextpassword","username localuser secret plaintextpassword\nline con 0\nlogin authentication default\nprivilege level 15","username localuser secret plaintextpassword\nline con 0\nno login local\nprivilege level 15"],a:[2],
 e:"C creates a local user with a hashed secret and applies the default login method to the console. B still authenticates against RADIUS, which has failed, and A uses a line password instead of a username."},
{id:"Q127",t:"IPS",q:"Which two features introduced in SNMPv2 provide the ability to retrieve large amounts of data in one request and acknowledge a trap using PDUs?",
 o:["Inform","GetNext","GetBulk","Get","Set"],a:[0,2],
 e:"GetBulk retrieves large amounts of data in one request, and Inform is a trap the manager acknowledges. Both were new in SNMPv2. GetNext, Get and Set already existed in SNMPv1.",
 n:"The dump's answer key says B and C (GetNext and GetBulk). GetNext dates from SNMPv1 and has nothing to do with acknowledging traps, so this app marks A and C. Expect to see the dump's answer if you're memorising it."},
{id:"Q128",t:"IPS",q:"Refer to the exhibit. A network engineer must replicate the AccessSw1 NTP configuration on a new switch. The engineer could not access privileged mode on AccessSw1 to view its configuration. Which command must be applied to the new switch to replicate the configuration?",
 x:{cap:"AccessSw1> show ntp associations",txt:
`  address         ref clock     st  when  poll  reach  delay   offset  disp
*~2001:DB8:12::1  127.127.1.1   3   39    64    377    23.903  -5.581  2.077
 * sys.peer, # selected, + candidate, - outlyer, x falseticker, ~ configured`},
 o:["ntp server 127.127.1.1","ntp server 2001:db8:12::1","ntp master","ntp master 3"],a:[0],
 e:"The dump's key says ntp server 127.127.1.1.",
 n:"The configured peer (~) is 2001:DB8:12::1, so in practice ntp server 2001:db8:12::1 (option B) replicates AccessSw1's config. 127.127.1.1 is just the reference clock that server uses. The app follows the dump's key (A), so watch for this one on the real exam."},
{id:"Q129",t:"SEC",q:"Refer to the exhibit. Which minimum configuration items are needed to enable Secure Shell version 2 access to R15?",
 x:{cap:"Router#show run (excerpt)",txt:
`version 15.2
no service password-encryption
hostname Router
no aaa new-model
no ip icmp rate-limit unreachable
--More--`},
 o:["Router(config)# hostname R15\nR15(config)# crypto key generate rsa general-keys modulus 1024\nR15(config-line)# line vty 0 15\nR15(config-line)# transport input ssh\nR15(config)# ip ssh source-interface Fa0/0\nR15(config)# ip ssh stricthostkeycheck",
    "Router(config)# ip domain-name cisco.com\nRouter(config)# crypto key generate rsa general-keys modulus 1024\nRouter(config)# ip ssh version 2\nRouter(config-line)# line vty 0 15\nRouter(config-line)# transport input all\nRouter(config)# ip ssh logging events",
    "Router(config)# hostname R15\nR15(config)# ip domain-name cisco.com\nR15(config)# crypto key generate rsa general-keys modulus 1024\nR15(config)# ip ssh version 2\nR15(config-line)# line vty 0 15\nR15(config-line)# transport input ssh",
    "Router(config)# crypto key generate rsa general-keys modulus 1024\nRouter(config)# ip ssh version 2\nRouter(config-line)# line vty 0 15\nRouter(config-line)# transport input ssh\nRouter(config)# ip ssh logging events\nR15(config)# ip ssh stricthostkeycheck"],a:[2],
 e:"Generating an RSA key needs a non-default hostname and a domain name. Then set ip ssh version 2 and allow SSH on the VTY lines."},
{id:"Q130",t:"IPS",q:"Which protocol should be used to transfer large files on a company intranet that allows UDP 69 through the firewall?",
 o:["REST API","FTP","SMTP","TFTP"],a:[3],
 e:"TFTP uses UDP port 69. FTP uses TCP 20/21."},
{id:"Q131",t:"SEC",q:"Refer to the exhibit. Connections must be blocked from PC2 to the file server while still allowing PC2 to connect to other network hosts and devices. Which configuration must be used to complete the task?",
 x:{cap:"Topology",txt:
`PC1 ─┐
     SW1 ── g0/1 [R1] g0/0 ── g0/0 [R2] g0/1 ── Server
PC2 ─┘
192.168.2.10`},
 o:["R1(config)#access-list 1 deny 192.168.2.10\nR1(config)#access-list 1 permit 192.168.2.0 0.0.0.255\nR1(config)#interface g0/0\nR1(config-if)#ip access-group 1 in",
    "R2(config)#access-list 1 deny 192.168.2.10\nR2(config)#access-list 1 permit any\nR2(config)#interface g0/1\nR2(config-if)#ip access-group 1 out",
    "R2(config)#access-list 1 permit 192.168.2.10\nR2(config)#access-list 1 deny 192.168.2.0 0.0.0.255\nR2(config)#interface g0/1\nR2(config-if)#ip access-group 1 in",
    "R1(config)#access-list 1 permit 192.168.2.10\nR1(config)#access-list 1 deny any\nR1(config)#interface g0/1\nR1(config-if)#ip access-group 1 out"],a:[1],
 e:"Standard ACLs go as close to the destination as possible. Outbound on R2 g0/1 (toward the server) blocks only PC2→server, and permit any lets everything else through."},

{id:"Q133",t:"IPS",q:"Which function does an iterative DNS query serve in the domain name resolution process?",
 o:["Obtain information directly from all root DNS servers configured within the scope","Encrypt communication automatically between DNS clients and servers","Allow a DNS client to contact several DNS servers until the correct information is found","Update records dynamically across multiple DNS servers at the same time"],a:[2],
 e:"In an iterative lookup each server returns a referral to the next server (root, then TLD, then authoritative), and the resolver keeps asking until it gets the answer."},
{id:"Q134",t:"SEC",q:"What is a function of a Next-Generation IPS?",
 o:["correlates user activity with network events","integrates with a RADIUS server to enforce Layer 2 device authentication rules","serves as a controller within a controller-based network","makes forwarding decisions based on learned MAC addresses"],a:[0],
 e:"An NGIPS adds context (users, applications, hosts) and correlates it with network events for better threat detection."},
{id:"Q135",t:"IPC",q:"When deploying a new network that includes both Cisco and third-party network devices, which redundancy protocol avoids the interruption of network traffic if the default gateway router fails?",
 o:["VRRP","FHRP","HSRP","GLBP"],a:[0],
 e:"VRRP is the open-standard first-hop redundancy protocol, so it works across vendors. HSRP and GLBP are Cisco-proprietary, and FHRP is the generic name for the family."},
{id:"Q136",t:"SEC",q:"Refer to the exhibit. A VTY password has been set to Labtest32! for remote access. Which commands are required to allow only SSH access and to hide passwords in the running configuration?",
 x:{cap:"SW1",txt:
`SW1#conf t
SW1(config)#enable password test!2E
SW1(config)# line con 0
SW1(config-line)# password Labtest32!

 o:["SW1(config-line)#exit\nSW1(config)#aaa new-model","SW1(config-line)#transport input ssh\nSW1(config-line)#exit\nSW1(config)#service password-encryption","SW1(config-line)#login local\nSW1(config-line)#exit\nSW1(config)#enable secret test!2E","SW1(config-line)#login local\nSW1(config-line)#exit\nSW1(config)#crypto key generate rsa"],a:[1],

{id:"Q137",t:"SEC",q:"Refer to the exhibit. What is the effect of the configuration?",
 x:{cap:"Config",txt:
`access-list 10 permit 10.0.0.0 0.0.0.255

 e:"Wildcard 0.0.0.255 matches 10.0.0.0–10.0.0.255 inbound on Serial0. Everything else is dropped by the implicit deny."},
{id:"Q138",t:"IPC",q:"Refer to the exhibit. The static routes were implemented on the border router. What is the next hop IP address for a ping sent to 172.16.153.154 from the border router?",
 x:{cap:"Border router",txt:

ip route 172.16.153.153 255.255.255.255 10.65.34.19

{id:"Q139",t:"SEC",q:"Which command must be configured to enable port security with a manually assigned MAC address of aabb.cc00.1234 for a VoIP handset on VLAN 4?",

{id:"Q140",t:"SEC",q:"An engineer is updating the configuration on a switch. To meet updated security standards, Telnet must be replaced with encrypted connections, and the modulus size must be increased to 2048 bits. Which two commands must the engineer configure on the switch?",
 o:["crypto key generate rsa modulus 2048","transport input ssh","crypto key generate rsa usage-keys","transport input all","crypto key generate rsa general-keys modulus 1024"],a:[0,1],

{id:"Q141",t:"AUTO",q:"What is an advantage of using SDN versus traditional networking when it comes to security?",
 o:["It exposes an API to configure locally per device for security policies.","It creates a unified control point making security policies consistent across all devices.","Devices communicate with each other to establish a security policy.","Security is managed near the perimeter of the network with firewalls, VPNs, and IPS."],a:[1],
 e:"A controller pushes one consistent policy to every device. In a traditional network each box is configured by hand."},
{id:"Q142",t:"IPS",q:"Refer to the exhibit. A network engineer must configure the CPE router to allow computers in the 172.20.1.0/24 network to obtain their IP configurations from the central DHCP server. Which configuration must the engineer apply to the CPE?",
 x:{cap:"Topology",txt:
`PCs ── g0/1 172.20.1.1/24 [CPE] g0/0 172.20.254.1/24 ── Company Network ── DHCP Server 172.20.255.11`},
 o:["interface GigabitEthernet0/0\nip helper-address 172.20.255.1","interface GigabitEthernet0/1\nip helper-address 172.20.255.11","interface GigabitEthernet0/1\nip helper-address 172.20.254.1","interface GigabitEthernet0/0\nip helper-address 172.20.1.1"],a:[1],
 e:"ip helper-address goes on the interface facing the clients (g0/1) and points at the DHCP server's address (172.20.255.11)."},
{id:"Q143",t:"SEC",q:"A Cisco engineer is configuring a factory-default router with these three passwords:\n1. The user EXEC password for console access is p4ssw0rd1.\n2. The user EXEC password for Telnet access is s3cr3t2.\n3. The password for privileged EXEC mode is priv4t3p4ss.\nWhich command sequence must the engineer configure?",
 o:["enable secret priv4t3p4ss\nline con 0\npassword login p4ssw0rd1\nline vty 0 15\npassword login s3cr3t2\nlogin","enable secret priv4t3p4ss\nline con 0\npassword p4ssw0rd1\nlogin\nline vty 0 15\npassword s3cr3t2\nlogin","enable secret priv4t3p4ss\nline con 0\npassword p4ssw0rd1\nline vty 0 15\npassword s3cr3t2","enable secret privilege 15 priv4t3p4ss\nline con 0\npassword p4ssw0rd1\nlogin\nline vty 0 15\npassword s3cr3t2\nlogin"],a:[1],
 e:"Each line needs both password and login, or the password isn't checked. password login isn't valid syntax, and enable secret takes no privilege keyword."},
{id:"Q144",t:"SEC",q:"If Port-channel1 is the uplink interface of the access-layer switch toward the distribution-layer switch, which two configurations must be configured on the access-layer switch to provide protection from an ARP spoofing attack?",
 o:["ip dhcp snooping\ninterface Port-channel1\nswitchport port-security maximum 1\nswitchport port-security","ip dhcp snooping vlan 1-4094\ninterface Port-channel1\nswitchport protected\nswitchport port-security maximum 1","ip arp inspection vlan 1-4094\ninterface Port-channel1\nip arp inspection trust","ip dhcp snooping vlan 1-4094\nip dhcp snooping\ninterface Port-channel1\nip dhcp snooping trust","ip arp inspection trust\ninterface Port-channel1\nswitchport port-security maximum 4094\nswitchport port-security\nip verify source mac-check"],a:[2,3],
 e:"DAI relies on the DHCP snooping binding table, so both features are needed, and the uplink toward the DHCP server and distribution layer is trusted for each."},
{id:"Q145",t:"SEC",q:"Which characteristic differentiates the concept of authentication from authorization and accounting?",
 o:["identity verification","service limitations","consumption-based billing","user-activity logging"],a:[0],
 e:"Authentication checks who you are. Authorization decides what you may do, and accounting records what you did."},
{id:"Q146",t:"SEC",q:"Refer to the exhibit. An engineer executed the script and added commands that were not necessary for SSH and now must remove the commands. Which two commands must be executed to correct the configuration?",
 x:{cap:"Script",txt:
`hostname CPE
service password-encryption
ip domain name ccna.cisco.com
ip name-server 198.51.100.210
crypto key generate rsa modulus 1024
username admin privilege 15 secret s0m3s3cr3t
line vty 0 4
 transport input ssh
 login local`},
 o:["no ip name-server 198.51.100.210","no hostname CPE","no ip domain name ccna.cisco.com","no login local","no service password-encryption"],a:[0,4],

{id:"Q147",t:"AUTO",q:"What is the function of a northbound API in a network architecture that separates the control and application layers?",
 o:["It supports distributed processing for configuration.","It upgrades software and restores files.","It provides a path between an SDN controller and network applications.","It relies on global provisioning and configuration."],a:[2],
 e:"Northbound APIs connect the controller to applications above it. Southbound APIs connect it to devices below."},
{id:"Q148",t:"SEC",q:"Refer to the exhibit. An access list is created to deny Telnet access from host PC-1 to RTR-1 and allow access from all other hosts. A Telnet attempt from PC-2 gives this message: \"% Connection refused by remote host.\" Without allowing Telnet access from PC-1, which action must be taken to permit the traffic?",
 x:{cap:"RTR-1 (G0/0 10.150.1.254/24) · PC-1 10.150.1.1 · PC-2 10.150.1.2",txt:

interface GigabitEthernet0/0
 ip address 10.150.1.254 255.255.255.0
access-list 10 deny host 10.150.1.1
line con 0
 password 7 0822455D0A16
 login
line vty 0 4
 access-class 10 in
 password 7 0822455D0A16
 login`},
 o:["Add the ip access-group 10 out command to interface g0/0.","Add the access-list 10 permit any command to the configuration.","Remove the access-class 10 in command from line vty 0 4.","Remove the password command from line vty 0 4."],a:[1],
 e:"Every ACL ends with an implicit deny any, so ACL 10 blocks everyone. Adding permit any after the deny lets PC-2 and other hosts in."}
],

{id:"Q149",t:"IPS",q:"Which file transfer protocol omits a username or password requirement and acknowledges all data sent?",
 o:["FTP","SCP","SFTP","TFTP"],a:[3],
 e:"TFTP has no authentication. It runs over UDP 69 but acknowledges every data block itself, sending one block at a time."},
{id:"Q150",t:"IPS",q:"What is the purpose of a CNAME record?",
 o:["to associate an alias to a canonical domain name","to map a domain name to an IP address","to direct email to a mail server","to identify the authoritative name server for a domain"],a:[0],
 e:"A CNAME maps an alias to its canonical name. A/AAAA map names to IPs, MX is for mail, and NS identifies name servers."},
{id:"Q151",t:"IPS",q:"Which SNMP message type is reliable and precedes an acknowledgment response from the SNMP manager?",
 o:["Set","Get","Inform","Traps"],a:[2],
 e:"An Inform is a trap the manager must acknowledge, and the agent resends it if no acknowledgement arrives. Ordinary traps aren't acknowledged."},
{id:"Q152",t:"SEC",q:"How do AAA operations compare regarding user identification, user services, and access control?",
 o:["Authorization identifies users, and authentication provides access control.","Authentication identifies users, and accounting tracks user services.","Authorization provides access control, and authentication tracks user services.","Accounting tracks user services, and authentication provides access control."],a:[1],
 e:"Authentication identifies the user, authorization controls access, and accounting tracks the services used."},
{id:"Q153",t:"SEC",q:"Refer to the exhibit. The Wi-Fi SSID \"Office_WLan\" has Layer 2 Security configured with MAC filtering enabled. What additional security is provided by this specific feature?",
 x:{cap:"WLAN › Security › Layer2 (transcribed)",txt:
`Layer 2 Security ..... WPA2+WPA3
Security Type ........ Enterprise
MAC Filtering ........ [x]
Policy ............... [x] WPA2  [x] WPA3
Encryption Cipher .... [ ] CCMP128(AES)  [ ] CCMP256  [ ] GCMP128  [x] GCMP256
Fast Transition ...... Disable
PMF .................. Optional`},
 o:["There is an extra layer of security that ensures only authorized devices with known MAC addresses connect to the network.","All data frames exchanged between the client and the access point are encrypted.","There is Galois cache algorithm configured that provides strong encryption and authentication.","There is a strong mutual authentication used between NAC and the network devices using x.509 standard."],a:[0],
 e:"MAC filtering admits only clients whose MAC address is on an allowed list. The encryption comes from the WPA2/WPA3 cipher, not from MAC filtering."},
{id:"Q154",t:"NA",q:"What is the primary purpose of a console port on a Cisco WLC?",
 o:["out-of-band management via an asynchronous transport","in-band management via an asynchronous transport","in-band management via an IP transport","out-of-band management via an IP transport"],a:[0],
 e:"The console is a serial (asynchronous) connection that works without the data network, so it's out-of-band management."},
{id:"Q155",t:"IPS",q:"Refer to the exhibit. HQC needs to use a configuration that:\n1. handles up to 150,000 concurrent connections\n2. minimizes consumption of public IP addresses.\nWhich configuration meets the requirements?",
 x:{cap:"Topology",txt:
`HQC (209.165.201.0/29 public block) ── [CPE] g0/0 209.165.200.225/30 ── ISP 209.165.200.226/30`},

{id:"Q156",t:"AUTO",q:"What are two benefits of controller-based networking?",
 o:["allows for fewer network failures","increases network bandwidth usage","reduces network configuration complexity","inflates software costs","provides centralization of key IT functions"],a:[2,4],
 e:"Centralized management and less configuration complexity are the standard benefits of controller-based networking."}
],

{id:"Q157",t:"AUTO",q:"What is the function of the controller in a software-defined network?",
 o:["making routing decisions","fragmenting and reassembling packets","forwarding packets","multicast replication at the hardware level"],a:[0],
 e:"The controller runs the control plane, deciding where traffic goes. Forwarding is the data plane on the devices."},
{id:"Q158",t:"IPS",q:"What is the function of a DNS zone transfer?",

{id:"Q159",t:"SEC",q:"An engineer is configuring remote access to a router from IP subnet 10.139.58.0/28. The domain name, crypto keys, and SSH have been configured. Which configuration enables the traffic on the destination router?",
 o:["interface FastEthernet0/0\nip address 10.122.49.1 255.255.255.240\naccess-group 120 in\nip access-list extended 120\npermit tcp 10.139.58.0 255.255.255.248 any eq 22",
    "interface FastEthernet0/0\nip address 10.122.49.1 255.255.255.252\nip access-group 105 in\nip access-list standard 105\npermit tcp 10.139.58.0 0.0.0.7 eq 22 host 10.122.49.1",
    "interface FastEthernet0/0\nip address 10.122.49.1 255.255.255.252\nip access-group 110 in\nip access-list extended 110\npermit tcp 10.139.58.0 0.0.0.15 host 10.122.49.1 eq 22",

{id:"Q160",t:"NA",q:"A network engineer starts to implement a new wireless LAN by configuring the authentication server and creating the dynamic interface. What must be performed next to complete the basic configuration?",

{id:"Q213",t:"IPS",q:"Refer to the exhibit. Hosts on the R4 LAN (Fa0/1) must get addresses from the DHCP server at 10.0.1.1. Which configuration enables DHCP for the hosts?",
 x:{cap:"R4",txt:
`interface FastEthernet0/0
 description WAN_INTERFACE
 ip address 10.0.1.2 255.255.255.252
 ip access-group 100 in
interface FastEthernet0/1
 description LAN_INTERFACE
 ip address 10.148.2.1 255.255.255.0
ip forward-protocol nd
access-list 100 permit eigrp any any
access-list 100 permit icmp any any
access-list 100 permit tcp 10.149.3.0 0.0.0.255 host 10.0.1.2 eq 22
access-list 100 permit tcp any any eq 80
access-list 100 permit tcp any any eq 443
access-list 100 deny ip any any log`},
 o:["interface FastEthernet0/1\n ip helper-address 10.0.1.1\naccess-list 100 permit tcp host 10.0.1.1 eq 67 host 10.148.2.1",
    "interface FastEthernet0/1\n ip helper-address 10.0.1.1\naccess-list 100 permit udp host 10.0.1.1 eq bootps host 10.148.2.1",
    "interface FastEthernet0/0\n ip helper-address 10.0.1.1\naccess-list 100 permit udp host 10.0.1.1 eq bootps host 10.148.2.1",
    "interface FastEthernet0/0\n ip helper-address 10.0.1.1\naccess-list 100 permit host 10.0.1.1 host 10.148.2.1 eq bootps"],a:[1],
 e:"The helper-address goes on the interface that receives the client broadcasts, which is the LAN (Fa0/1). The reply from the server comes back in Fa0/0 as UDP bootps (67) to the relay address 10.148.2.1, so ACL 100 has to permit it. DHCP uses UDP, not TCP. (Strictly, the permit must be placed above the final deny for it to take effect.)"},
{id:"Q214",t:"NA",q:"Which WLC interface is used exclusively as a DHCP relay?",
 o:["virtual","distribution","service","AP-manager"],a:[0],

{id:"Q215",t:"SEC",q:"Which IPsec encryption mode is appropriate when the destination of a packet differs from the security termination point?",
 o:["transport","tunnel","dynamic","extended"],a:[1],
 e:"In a site-to-site VPN the gateways terminate IPsec while the real destination is a host behind them, so the full packet is encapsulated in tunnel mode."},
{id:"Q216",t:"NA",q:"Which type of switch port must be configured for a FlexConnect AP that serves multiple SSIDs mapped to different VLANs?",
 o:["trunk","EtherChannel","access","PoE"],a:[0],
 e:"FlexConnect switches client traffic locally onto VLANs, so the AP's port has to carry several VLANs. That means a trunk."},
{id:"Q217",t:"NF",q:"Which cable type is used to connect a router port to a switch port?",
 o:["console","crossover","rollover","straight-through"],a:[3],
 e:"Unlike devices (router to switch, PC to switch) use straight-through. Like devices use crossover, although Auto-MDIX now hides the difference."},
{id:"Q218",t:"AUTO",q:"What are two features of Ansible?",
 o:["It requires a proprietary database for state management.","It uses the YAML language.","It supplies network credentials.","It launches job templates using version control.","It offers agentless deployment."],a:[1,4],

{id:"Q223",t:"IPS",q:"How does a DNS server improve network efficiency when resolving domain names?",
 o:["by caching DNS records to reduce the number of external queries","by permanently storing all DNS records for faster access","by using round-robin scheduling to balance the load across multiple servers","by compressing DNS records to decrease their size"],a:[0],
 e:"Resolvers cache answers until the TTL expires, so repeated lookups don't go out to the internet again. Records aren't stored permanently because the TTL expires them."},

      10.0.0.0/8 is variably subnetted, 3 subnets, 3 masks
C        10.10.100.0/26 is directly connected, GigabitEthernet0/0/6
C        10.10.10.0/24 is directly connected, GigabitEthernet0/0/0
